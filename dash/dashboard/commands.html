<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProMcBot — Commands Library</title>
  <meta name="description" content="Full list of ProMcBot Discord bot commands for Minecraft servers — search, copy, and master every command.">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css?v=8">
  <style>
    .landing-nav { background: rgba(7,10,21,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); }
    .cmd-hero { max-width: 900px; margin: 0 auto; padding: 70px 24px 40px; text-align: center; }
    .cmd-hero h1 { font-size: clamp(28px, 5vw, 44px); margin: 0 0 12px; }
    .cmd-hero p { color: var(--text-secondary); font-size: 16px; max-width: 620px; margin: 0 auto; }
    .cmd-search-wrap { max-width: 640px; margin: 34px auto 0; position: relative; }
    .cmd-search {
      width: 100%; padding: 16px 20px 16px 50px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      color: var(--text); font-size: 16px; outline: none; transition: var(--transition-base);
    }
    .cmd-search:focus { border-color: rgba(255,120,60,0.5); box-shadow: 0 0 0 4px rgba(255,81,47,0.12); }
    .cmd-search-wrap i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 20px; }
    html[dir="rtl"] .cmd-search { padding: 16px 50px 16px 20px; }
    html[dir="rtl"] .cmd-search-wrap i { left: auto; right: 18px; }
    .cmd-tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .cmd-tab {
      padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); color: var(--text-secondary);
      transition: var(--transition-fast);
    }
    .cmd-tab:hover { color: var(--text); border-color: rgba(255,120,60,0.3); }
    .cmd-tab.active { background: var(--gradient-primary); color: #fff; border-color: transparent; }
    .cmd-grid { max-width: 1100px; margin: 0 auto 80px; padding: 0 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .cmd-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 24px; transition: var(--transition-base); display: flex; flex-direction: column; gap: 8px;
    }
    .cmd-card:hover { border-color: rgba(255,120,60,0.3); transform: translateY(-3px); box-shadow: 0 12px 32px rgba(255,81,47,0.14); }
    .cmd-name { font-family: 'JetBrains Mono', 'Consolas', monospace; font-size: 16px; font-weight: 700; color: #FF9A64; }
    .cmd-name i { margin-right: 8px; font-style: normal; color: var(--text-muted); }
    .cmd-desc { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
    .cmd-copy {
      margin-top: 10px; align-self: flex-start; display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer;
      background: rgba(255,81,47,0.12); border: 1px solid rgba(255,120,60,0.25); color: #FF9A64;
      transition: var(--transition-fast);
    }
    .cmd-copy:hover { background: rgba(255,81,47,0.22); }
    .cmd-empty { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 60px 20px; }
    footer.cmd-foot { text-align: center; padding: 28px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 13px; }
    @media (max-width: 640px) { .cmd-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="landing-nav">
    <a href="/" class="logo"><img src="/dashboard/logo.png" alt="ProMcBot" style="height:34px;margin-right:10px;vertical-align:middle;"> <span style="font-weight:700;">ProMcBot</span></a>
    <nav>
      <a href="/mc-lookup" data-i18n="home.mc_lookup">MC Lookup</a>
      <a href="/commands" data-i18n="home.commands">Commands</a>
      <a href="/docs" data-i18n="home.docs">Docs</a>
      <select class="lang-select-home" onchange="window.__pmc_i18n && window.__pmc_i18n.setLanguage(this.value)">
        <option value="en">🇬🇧 EN</option><option value="ar">🇸🇦 AR</option><option value="es">🇪🇸 ES</option>
      </select>
      <a href="/loading-auth" class="btn btn-primary btn-sm" style="background:linear-gradient(135deg,#FF512F,#F09819);color:#fff;padding:8px 18px;border-radius:var(--radius-md);font-weight:600;text-decoration:none;" data-i18n="nav.login">Login</a>
    </nav>
  </header>

  <section class="cmd-hero">
    <h1 data-i18n="cmd.title">ProMcBot Commands Library</h1>
    <p data-i18n="cmd.subtitle">Every command your server needs — search, copy, and use them inside your Discord.</p>
    <div class="cmd-search-wrap">
      <i class='bx bx-search'></i>
      <input type="text" class="cmd-search" id="cmdSearch" data-i18n-ph="cmd.search_ph" placeholder="Search commands...">
    </div>
  </section>

  <div class="cmd-tabs" id="cmdTabs"></div>
  <div class="cmd-grid" id="cmdGrid"></div>

  <footer class="cmd-foot">
    © ProMcBot — <a href="/" style="color:#FF9A64;">promcbot.dev</a>
  </footer>

  <script src="/i18n.js?v=8"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const TABS = [
      { id: 'all', key: 'cmd.tab_all' },
      { id: 'minecraft', key: 'cmd.tab_mc' },
      { id: 'moderation', key: 'cmd.tab_mod' },
      { id: 'automod', key: 'cmd.tab_automod' },
      { id: 'utility', key: 'cmd.tab_util' },
      { id: 'owner', key: 'cmd.tab_owner' }
    ];
    // Human categories derived from command paths
    function categorize(name) {
      const n = (name || '').toLowerCase();
      if (/^(mc-|server)/.test(n)) return 'minecraft';
      if (/^(ban|kick|mute|timeout|purge|warn|unban|filter|whitelist|action)/.test(n)) return 'moderation';
      if (/^(automod|autobot)/.test(n)) return 'automod';
      if (/^(ping|help|avatar|invite|stats|support|playercard|claim)/.test(n)) return 'utility';
      return 'owner';
    }
    const CAT_LABELS = { minecraft: 'Minecraft', moderation: 'Moderation', automod: 'AutoMod', utility: 'Utility', owner: 'Owner' };
    let COMMANDS = [];
    let activeTab = 'all';

    async function load() {
      try {
        const r = await fetch('/api/commands');
        const d = await r.json();
        COMMANDS = (d && d.commands) || [];
        renderTabs();
        renderCommands();
      } catch (e) {
        $('cmdGrid').innerHTML = '<div class="cmd-empty" data-i18n="cmd.load_fail">Could not load commands. Please refresh the page.</div>';
      }
    }

    function renderTabs() {
      $('cmdTabs').innerHTML = TABS.map(t =>
        `<span class="cmd-tab ${t.id === activeTab ? 'active' : ''}" data-tab="${t.id}" data-i18n="${t.key}">${t.id}</span>`
      ).join('');
      document.querySelectorAll('.cmd-tab').forEach(el => {
        el.addEventListener('click', () => { activeTab = el.dataset.tab; renderTabs(); renderCommands(); });
      });
    }

    function renderCommands() {
      const q = ($('cmdSearch').value || '').trim().toLowerCase();
      let list = COMMANDS.filter(c => c && c.enabled !== false);
      if (activeTab !== 'all') list = list.filter(c => categorize(c.name) === activeTab);
      if (q) list = list.filter(c => (c.name || '').toLowerCase().includes(q) || (c.description || '').toLowerCase().includes(q));
      if (!list.length) {
        $('cmdGrid').innerHTML = '<div class="cmd-empty" data-i18n="cmd.no_results">No commands found. Try another keyword.</div>';
        if (window.__pmc_i18n) window.__pmc_i18n.applyTranslations();
        return;
      }
      $('cmdGrid').innerHTML = list.map(c => {
        const cat = categorize(c.name);
        return `<div class="cmd-card">
          <div class="cmd-name"><i>/</i>${escapeHtml(c.name || 'unknown')}</div>
          <div class="cmd-desc">${escapeHtml(c.description || '')}</div>
          <span class="cmd-copy" data-cmd="${escapeHtml('/' + (c.name || ''))}"><i class='bx bx-copy'></i> <span data-i18n="cmd.copy">Copy</span></span>
        </div>`;
      }).join('');
      document.querySelectorAll('.cmd-copy').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(btn.dataset.cmd);
            btn.innerHTML = `<i class='bx bx-check'></i> <span data-i18n="cmd.copied">Copied!</span>`;
            setTimeout(() => { btn.innerHTML = `<i class='bx bx-copy'></i> <span data-i18n="cmd.copy">Copy</span>`; }, 1500);
          } catch (_) {}
        });
      });
      if (window.__pmc_i18n) window.__pmc_i18n.applyTranslations();
    }

    function escapeHtml(x) {
      return String(x).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }

    $('cmdSearch').addEventListener('input', renderCommands);
    if (window.__pmc_i18n) {
      window.__pmc_i18n.initLanguage && window.__pmc_i18n.initLanguage();
    }
    load();
  </script>
</body>
</html>
