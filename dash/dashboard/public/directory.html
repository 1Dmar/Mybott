<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Server Directory — ProMcBot</title>
  <meta name="description" content="Discover top Minecraft servers with live status, player counts and one-click join — powered by ProMcBot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <style>
    :root {
      --bg: #030409; --bg-2: #0a0f1c;
      --surface: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8eaef; --text-2: #9aa3b2;
      --primary: #FF512F; --primary-2: #F09819;
      --green: #10B981; --red: #EF4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Inter', sans-serif; overflow-x: hidden;
    }
    body::after {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 45% at 20% 0%, rgba(255, 81, 47, 0.14), transparent 60%),
        radial-gradient(ellipse 55% 45% at 85% 20%, rgba(79, 58, 255, 0.12), transparent 60%),
        radial-gradient(ellipse 60% 40% at 50% 100%, rgba(240, 152, 25, 0.10), transparent 60%);
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 36px 22px 90px; position: relative; z-index: 1; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 38px; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; text-decoration: none; color: var(--text); }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: grid; place-items: center; font-size: 18px; color: #fff;
    }
    .back-btn {
      color: var(--text-2); text-decoration: none; font-size: 14px;
      display: flex; align-items: center; gap: 6px;
      padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); transition: all .25s;
    }
    .back-btn:hover { color: var(--text); border-color: rgba(255, 81, 47, .5); }
    h1.page-title {
      font-size: 34px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px;
      background: linear-gradient(120deg, #fff 20%, var(--primary-2));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .page-sub { color: var(--text-2); font-size: 15px; margin-bottom: 30px; max-width: 620px; }
    .search-box {
      position: relative; margin-bottom: 28px;
    }
    .search-box input {
      width: 100%; padding: 15px 20px 15px 48px; font-size: 14.5px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      color: var(--text); outline: none; font-family: inherit;
      transition: border-color .25s;
    }
    .search-box input:focus { border-color: rgba(255, 81, 47, .5); }
    .search-box i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-2); font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 18px; }
    .srv {
      position: relative; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 24px; backdrop-filter: blur(12px);
      transition: transform .25s, border-color .25s, box-shadow .25s;
      display: flex; flex-direction: column;
    }
    .srv:hover { transform: translateY(-4px); border-color: rgba(255, 81, 47, .45); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
    .srv-head { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .srv-logo {
      width: 56px; height: 56px; border-radius: 14px; object-fit: cover;
      border: 1px solid rgba(255,255,255,.12); background: var(--bg-2);
    }
    .srv-name { font-size: 16.5px; font-weight: 700; line-height: 1.3;
      background: linear-gradient(120deg, #fff 15%, var(--primary-2) 120%);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .srv-desc { color: var(--text-2); font-size: 13px; line-height: 1.55; flex: 1; margin-bottom: 16px; }
    .srv-badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .badge {
      font-size: 11.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(255,255,255,.04); color: var(--text-2);
      display: flex; align-items: center; gap: 5px;
    }
    .badge.online { border-color: rgba(16,185,129,.45); color: var(--green); background: rgba(16,185,129,.1); }
    .badge.offline { border-color: rgba(239,68,68,.45); color: var(--red); background: rgba(239,68,68,.1); }
    .badge.top { border-color: rgba(240,152,25,.55); color: var(--primary-2); background: rgba(240,152,25,.12); }
    .srv-actions { display: flex; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; justify-content: center;
      font-weight: 600; font-size: 13px; padding: 11px 18px; border-radius: 999px;
      text-decoration: none; border: none; cursor: pointer; transition: all .25s;
      flex: 1;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); color: #fff;
      box-shadow: 0 8px 24px rgba(255, 81, 47, .3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(255, 81, 47, .45); }
    .btn-ghost { background: rgba(255,255,255,.05); border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: rgba(255,81,47,.5); }
    .empty {
      text-align: center; padding: 70px 20px; color: var(--text-2);
      border: 1px dashed var(--border); border-radius: 20px;
    }
    .vote-wrap { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .vote-btn {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
      background: linear-gradient(135deg, #FF9A3C, #FF512F); color: #fff; border: none; cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .vote-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(255, 81, 47, .4); }
    .vote-btn.voted { background: rgba(16,185,129,.15); color: #10B981; border: 1px solid rgba(16,185,129,.35); }
    .vote-btn.voted:hover { transform: none; box-shadow: none; }
    .vote-count {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px; border-radius: 10px;
      background: rgba(255,255,255,.05); border: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--text);
    }
    .vote-count i { color: #FF9A3C; }
    .vote-err { color: #EF4444; font-size: 12px; margin-top: 6px; display: none; }
    .empty i { font-size: 42px; display: block; margin-bottom: 14px; color: var(--primary-2); }
    .footer-note { text-align: center; color: var(--text-2); font-size: 13px; margin-top: 44px; }
    .footer-note a { color: var(--primary-2); text-decoration: none; font-weight: 600; }
    @media (max-width: 640px) {
      h1.page-title { font-size: 26px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <a class="logo" href="https://promcbot.dev/">
        <div class="logo-mark"><i class='bx bx-game'></i></div>
        <span>ProMcBot</span>
      </a>
      <a class="back-btn" href="https://promcbot.dev/"><i class='bx bx-left-arrow-alt'></i> Back</a>
    </div>
    <h1 class="page-title">Minecraft Server Directory</h1>
    <p class="page-sub">Live status, player counts and one-click join. Every server here is registered with ProMcBot and monitored in real time.</p>
    <div class="search-box">
      <i class='bx bx-search'></i>
      <input id="search" type="text" placeholder="Search servers...">
    </div>
    <div class="grid" id="grid"></div>
    <p class="footer-note">Own a Minecraft server? <a href="https://promcbot.dev/invitebot">Add ProMcBot</a> and publish your own page for free.</p>
  </div>
  <script>
    const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    let all = [];
    async function load() {
      const res = await fetch('/api/servers');
      const data = await res.json();
      all = (data.servers || []).map(s => ({ ...s, live: null }));
      // fetch live status for each in parallel
      await Promise.all(all.map(async (srv) => {
        try {
          const r = await fetch('/api/s/' + srv.guildId);
          const d = await r.json();
          if (d.success && d.live) srv.live = d.live;
        } catch (_) {}
      }));
      render();
    }
    function render() {
      const q = document.getElementById('search').value.toLowerCase().trim();
      const list = all.filter(s =>
        !q || (s.publicName || '').toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q)
      );
      const grid = document.getElementById('grid');
      if (!list.length) {
        grid.innerHTML = '<div class="empty"><i class=\'bx bx-server\'></i>No servers listed yet.<br>Be the first to publish your server page.</div>';
        return;
      }
      grid.innerHTML = list.map(s => {
        const online = s.live?.online;
        const statusBadge = online
          ? `<span class="badge online"><i class='bx bxs-circle' style="color:#10B981;font-size:9px"></i>${s.live.players.online} online</span>`
          : `<span class="badge offline"><i class='bx bxs-circle' style="color:#EF4444;font-size:9px"></i>Offline</span>`;
        const topBadge = s.featured
          ? `<span class="badge top"><i class='bx bxs-star'></i>Featured</span>`
          : '';
        const boostBadge = (s.boostedUntil || 0) > Date.now()
          ? `<span class="badge boosted"><i class='bx bxs-rocket'></i>Boosted</span>`
          : '';
        const ipHtml = s.javaIP ? `<span class="badge"><i class='bx bx-server'></i>${escapeHtml(s.javaIP)}</span>` : '';
        return `
          <div class="srv">
            <div class="srv-head">
              <img class="srv-logo" src="${s.logoUrl || ''}" onerror="this.style.opacity=0">
              <div class="srv-name">${escapeHtml(s.publicName)}</div>
            </div>
            <div class="srv-desc">${s.description ? escapeHtml(s.description) : 'A Minecraft server community powered by ProMcBot.'}</div>
            <div class="srv-badges">${statusBadge}${topBadge}${boostBadge}${ipHtml}</div>
            <div class="vote-wrap">
              <button class="vote-btn${s.voted ? ' voted' : ''}" data-guild="${s.guildId}" onclick="vote('${s.guildId}')">
                <i class='bx ${s.voted ? 'bx-badge-check' : 'bxs-vote'}'></i>${s.voted ? 'Voted' : 'Vote for this server'}
              </button>
              <span class="vote-count"><i class='bx bxs-flame'></i><span id="vc-${s.guildId}">${s.votes12h || 0}</span> votes / 12h</span>
            </div>
            <div class="vote-err" id="ve-${s.guildId}">Please log in via Discord to vote.</div>
            <div class="srv-actions">
              <a class="btn btn-primary" href="/s/${s.guildId}"><i class='bx bx-show'></i>Server Page</a>
              ${s.discordInvite ? `<a class="btn btn-ghost" href="${escapeHtml(s.discordInvite)}" target="_blank" rel="noopener"><i class='bx bxl-discord'></i>Join</a>` : ''}
            </div>
          </div>`;
      }).join('');
    }
    window.vote = async function (guildId) {
      try {
        const r = await fetch('/api/s/' + guildId + '/vote', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
        const d = await r.json();
        if (d.already) return; // already voted within 12h
        if (!d.ok) {
          const ve = document.getElementById('ve-' + guildId);
          if (ve) ve.style.display = 'block';
          return;
        }
        const srv = all.find(s => s.guildId === guildId);
        if (srv) { srv.voted = true; srv.votes12h = (srv.votes12h || 0) + 1; }
        render();
      } catch (_) {}
    };
    document.getElementById('search').addEventListener('input', render);
    // Load my vote statuses (works when logged in)
    async function loadMyVotes() {
      try {
        const me = await fetch('/api/me', { credentials: 'same-origin' });
        const m = me.ok ? await me.json() : { loggedIn: false };
        if (!m || !m.loggedIn) return;
        await Promise.all(all.map(async (srv) => {
          try {
            const r = await fetch('/api/s/' + srv.guildId + '/vote?userId=' + m.id, { credentials: 'same-origin' });
            const d = await r.json();
            if (d) { srv.votes12h = d.votes || 0; srv.voted = d.voted || false; }
          } catch (_) {}
        }));
        render();
      } catch (_) {}
    }
    load();
    loadMyVotes();
  </script>
</body>
</html>
