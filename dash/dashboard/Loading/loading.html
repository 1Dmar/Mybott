<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authenticating — ProMcBot</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    body {
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      font-family: 'Inter', sans-serif;
      overflow: hidden;
    }
    .loading-container {
      text-align: center;
      animation: fadeIn 0.8s ease-out;
      z-index: 1;
    }
    .loader-circle {
      width: 80px;
      height: 80px;
      border: 4px solid var(--border);
      border-top: 4px solid #FF512F;
      border-radius: 50%;
      margin: 0 auto 24px;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(255, 81, 47, 0.2);
    }
    .logo-center {
      width: 40px;
      height: 40px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: pulse 2s infinite;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }
    p {
      color: var(--text-secondary);
      font-size: 15px;
    }
    .bg-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(255, 81, 47, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <!-- ProMcBot SEO and social metadata -->
  <meta data-promcbot-metadata="1" name="description" content="Loading for the ProMcBot Discord and Minecraft management dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://promcbot.dev/dashboard">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ProMcBot">
  <meta property="og:title" content="Loading — ProMcBot Dashboard">
  <meta property="og:description" content="Loading for the ProMcBot Discord and Minecraft management dashboard.">
  <meta property="og:url" content="https://promcbot.dev/dashboard">
  <meta property="og:image" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:secure_url" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1983">
  <meta property="og:image:height" content="793">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Loading — ProMcBot Dashboard">
  <meta name="twitter:description" content="Loading for the ProMcBot Discord and Minecraft management dashboard.">
  <meta name="twitter:image" content="https://promcbot.dev/dashboard/share-preview.png">
</head>
<body class="dark">
  <div class="bg-glow"></div>
  <div class="loading-container">
    <div style="position:relative">
      <div class="loader-circle"></div>
      <img src="/dashboard/logo.png" class="logo-center" alt="L">
    </div>
    <h1>Secure Authentication</h1>
    <p id="statusText">Connecting to Discord OAuth...</p>
  </div>

  <script>
    // Check auth status and redirect
    async function checkAuth() {
      try {
        const res = await fetch('/callback/check/userData');
        const data = await res.json();
        
        if (data.authenticated) {
          document.getElementById('statusText').innerText = "Welcome back! Redirecting...";
          setTimeout(() => window.location.href = '/dashboard', 800);
        } else {
          // If not authenticated, send to Discord login
          document.getElementById('statusText').innerText = "Redirecting to Discord...";
          setTimeout(() => window.location.href = '/auth/discord', 1000);
        }
      } catch (e) {
        console.error("Auth check failed", e);
        window.location.href = '/auth/discord';
      }
    }
    
    // Start check after a small delay for visual effect
    setTimeout(checkAuth, 1500);

    // Apply theme
    if (localStorage.getItem('pmcbot_theme') === 'light') {
      document.body.classList.remove('dark');
    }
  </script>
</body>
</html>
