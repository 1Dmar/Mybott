<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ProMcBot - Server Activity</title>

        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/shared.css?v=25">
    <style>
        .activity-header h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        body.light .activity-header h1 { background: var(--blue-color); -webkit-background-clip: text; }
        body.light .activity-list { background: var(--card-bg); border-color: var(--border); }
        body.light .search-input, body.light .select-filter { background: var(--card-bg); border-color: var(--border); color: var(--text); }
        body.light .activity-item { border-bottom-color: var(--border); }
        body.light .activity-item:hover { background: rgba(0,0,0,0.02); }
        body.light .action-text .details { color: var(--text-secondary); }
        body.light .activity-list-header { background: rgba(0,0,0,0.03); color: var(--text); border-bottom-color: var(--border); }
        .menu_title {

            margin: 20px 0 10px;

            padding: 0 15px;

            font-size: 14px;

            text-transform: uppercase;

            letter-spacing: 0.5px;

            color: var(--grey-color-light);

        }

        

        

        

        

        

        

        

        .menu_items {

            padding: 0;

            list-style: none;

        }

        

        .navlink_icon {

            position: relative;

            font-size: 22px;

            min-width: 50px;

            line-height: 40px;

            display: inline-block;

            text-align: center;

            border-radius: 6px;

            transition: all 0.3s;

        }

        

        .navlink_icon::before {

            content: "";

            position: absolute;

            height: 100%;

            width: calc(100% + 100px);

            left: -20px;

        }

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        

        .bottom_content {

            position: absolute;

            bottom: 20px;

            left: 0;

            width: 100%;

            cursor: pointer;

            transition: all 0.5s ease;

            padding: 0 20px;

        }

        

        .bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            color: var(--text);
            border-top: 1px solid var(--border);
            background-color: var(--surface-2);
            border-radius: 8px;
        }

        

        

        

        .bottom i {

            font-size: 20px;

        }

        

        .bottom span {

            font-size: 16px;

        }

        

        

        

        /* Main Content */

        .main-content {

            padding: 90px 30px 30px;

            margin-left: var(--sidebar-width);

            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);

            flex: 1;

        }

        

        

        

        /* Activity Page Styles */

        .activity-header {

            text-align: center;

            margin-bottom: 40px;

        }

        

        .activity-header h1 {

            font-size: 2.8rem;

            margin-bottom: 15px;

            background: linear-gradient(90deg, var(--blue-color), var(--primary));

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

        }

        

        .activity-header p {

            font-size: 1.25rem;

            color: var(--grey-color);

            max-width: 700px;

            margin: 0 auto;

            opacity: 0.9;

        }

        

        .activity-filters {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

            flex-wrap: wrap;

            gap: 15px;

        }

        

        .filter-group {

            display: flex;

            align-items: center;

            gap: 15px;

        }

        

        .search-input {
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 1rem;
            min-width: 250px;
        }

        

        body.dark .search-input {
            background: var(--surface-2);
            border-color: var(--border);
        }

        .select-filter {
            padding: 12px 15px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
        }

        body.dark .select-filter {
            background: var(--surface-2);
            border-color: var(--border);
        }

        

        .refresh-btn {

            padding: 12px 20px;

            border-radius: 30px;

            background: var(--blue-color);

            color: white;

            border: none;

            font-size: 1rem;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 8px;

            transition: all 0.3s;

        }

        

        .refresh-btn:hover {

            background: #4752c4;

        }

        

        .activity-list {

            background: var(--white-color);

            border-radius: 15px;

            overflow: hidden;

            box-shadow: 0 5px 20px rgba(0,0,0,0.05);

            border: 1px solid var(--grey-color-light);

        }

        

        body.dark .activity-list {
            background: var(--surface);
            border-color: var(--border);
        }

        

        .activity-list-header {

            display: grid;

            grid-template-columns: 1fr 2fr 2fr 1fr;

            padding: 15px 25px;

            background: rgba(88, 101, 242, 0.1);

            color: var(--blue-color);

            font-weight: 600;

            border-bottom: 1px solid rgba(88, 101, 242, 0.2);

        }

        

        body.dark .activity-list-header {

            background: rgba(88, 101, 242, 0.2);

        }

        

        .activity-item {

            display: grid;

            grid-template-columns: 1fr 2fr 2fr 1fr;

            padding: 20px 25px;

            border-bottom: 1px solid var(--grey-color-light);

            transition: all 0.3s;

        }

        

        body.dark .activity-item {
            border-bottom: 1px solid var(--border);
        }

        

        .activity-item:last-child {

            border-bottom: none;

        }

        

        .activity-item:hover {

            background: rgba(88, 101, 242, 0.05);

        }

        

        .activity-user {

            display: flex;

            align-items: center;

            gap: 15px;

            font-weight: 500;

        }

        

        .user-avatar {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            background: var(--blue-color);

            display: flex;

            align-items: center;

            justify-content: center;

            color: white;

            font-weight: 600;

        }

        

        .activity-action {

            display: flex;

            align-items: center;

        }

        

        .action-icon {

            width: 36px;

            height: 36px;

            border-radius: 50%;

            background: rgba(88, 101, 242, 0.1);

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 15px;

            color: var(--blue-color);

            font-size: 1.1rem;

        }

        

        .action-text {

            flex: 1;

        }

        

        .action-text .main-action {

            font-weight: 500;

            margin-bottom: 5px;

        }

        

        .action-text .details {

            font-size: 0.9rem;

            color: var(--grey-color);

            opacity: 0.8;

            word-break: break-word;

        }

        

        .activity-reason {

            display: flex;

            align-items: center;

            color: var(--grey-color);

            font-style: italic;

        }

        

        .activity-timestamp {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            color: var(--grey-color);

            font-size: 0.9rem;

        }

        

        .time-ago {

            background: rgba(88, 101, 242, 0.1);

            padding: 5px 10px;

            border-radius: 30px;

            font-size: 0.8rem;

        }

        

        .no-activities {

            text-align: center;

            padding: 50px;

            color: var(--grey-color);

        }

        

        .pagination {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 30px;

        }

        

        .page-btn {

            width: 40px;

            height: 40px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--white-color);

            color: var(--grey-color);

            border: 1px solid var(--grey-color-light);

            cursor: pointer;

            transition: all 0.3s;

        }

        

        body.dark .page-btn {

            background: var(--dark-card);

            border-color: var(--border);

        }

        

        .page-btn.active {

            background: var(--blue-color);

            color: white;

            border-color: var(--blue-color);

        }

        

        .page-btn:hover:not(.active) {

            background: rgba(88, 101, 242, 0.1);

            color: var(--blue-color);

        }

        

        /* Loading animation */

        .loading {

            display: flex;

            justify-content: center;

            padding: 50px;

        }

        

        .loading-spinner {

            width: 50px;

            height: 50px;

            border: 5px solid rgba(88, 101, 242, 0.1);

            border-radius: 50%;

            border-top-color: var(--blue-color);

            animation: spin 1s ease-in-out infinite;

        }

        

        @keyframes spin {

            to { transform: rotate(360deg); }

        }

        

        /* Responsive Design */

        @media screen and (max-width: 992px) {

            

            

            

            

            .main-content {

                margin-left: 0;

                padding-top: 90px;

            }

            

            .mobile-toggle {

                display: block;

            }

            

            

            

            

            

            .activity-header h1 {

                font-size: 2.3rem;

            }

            

            .activity-list-header, .activity-item {

                grid-template-columns: 1fr;

                gap: 15px;

            }

            

            .activity-timestamp {

                justify-content: flex-start;

            }

        }

        

        @media screen and (max-width: 768px) {

            .search_bar {

                display: none;

            }

            

            .notification-dropdown {

                min-width: 300px;

                right: -50px;

            }

            

            .activity-header h1 {

                font-size: 2rem;

            }

            

            .activity-filters {

                flex-direction: column;

                align-items: flex-start;

            }

        }

        

        @media screen and (max-width: 576px) {

            

            

            .notification-dropdown {

                min-width: 280px;

                right: -80px;

            }

            

            .activity-header h1 {

                font-size: 1.8rem;

            }

        }

    </style>

<body>

    <!-- navbar -->

  <!-- NAVBAR -->
  <nav class="navbar">

  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->

    <section class="main-content">

        <!-- Header -->

        <div class="activity-header">

            <h1>Server Activity Log</h1>

            <p>View all recent actions and changes made to your server configuration</p>

        </div>

        

        <!-- Filters -->

        <div class="activity-filters">

            <div class="filter-group">

                <input type="text" class="search-input" placeholder="Search activities...">

                <select class="select-filter">

                    <option>All Actions</option>

                    <option>Configuration Changes</option>

                    <option>Moderation Actions</option>

                    <option>Server Updates</option>

                </select>

            </div>

            <button class="refresh-btn" id="refreshActivities">

                <i class='bx bx-refresh'></i> Refresh

            </button>

        </div>

        

        <!-- Activity List -->

        <div class="activity-list">

            <div class="activity-list-header">

                <div>User</div>

                <div>Action</div>

                <div>Reason</div>

                <div>Time</div>

            </div>

            

            <div id="activitiesContainer">

                <!-- Activities will be loaded here -->

                <div class="loading">

                    <div class="loading-spinner"></div>

                </div>

            </div>

        </div>

        

        <!-- Pagination -->

        <div class="pagination" id="pagination">

            <!-- Pagination will be added here by JavaScript -->

        </div>

        

        <!-- Footer -->

        <footer class="footer">

            <div class="footer-links">

                <a href="#">Home</a>

                <a href="#">Features</a>

                <a href="#">Pricing</a>

                <a href="#">Documentation</a>

                <a href="#">Support</a>

                <a href="#" data-i18n="pg.privacy_policy"></a>

                <a href="#" data-i18n="pg.terms"></a>

            </div>

            <div class="copyright">

                &copy; 2023 ProMcBot. All rights reserved. Minecraft is a trademark of Mojang AB.

            </div>

        </footer>

    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchActivities();
        });

        const notificationBtn = document.getElementById('notificationBtn');

        const notificationDropdown = document.getElementById('notificationDropdown');

        const userBtn = document.getElementById('userBtn');

        const userDropdown = document.getElementById('userDropdown');

        

        notificationBtn.addEventListener('click', (e) => {

            e.stopPropagation();

            notificationDropdown.classList.toggle('show');

            userDropdown.classList.remove('show');

        });

        

        userBtn.addEventListener('click', (e) => {

            e.stopPropagation();

            userDropdown.classList.toggle('show');

            notificationDropdown.classList.remove('show');

        });

        

        // Close dropdowns when clicking outside

        document.addEventListener('click', (e) => {

            if (!notificationBtn.contains(e.target) && !notificationDropdown.contains(e.target)) {

                notificationDropdown.classList.remove('show');

            }

            if (!userBtn.contains(e.target) && !userDropdown.contains(e.target)) {

                userDropdown.classList.remove('show');

            }

        });

        

        // Handle resize

        window.addEventListener('resize', () => {

            if (window.innerWidth > 992) {

                sidebar.classList.remove('active');

            }

        });

        

        // Refresh button

        document.getElementById('refreshActivities').addEventListener('click', fetchActivities);

        

        // Function to fetch activities from API

        async function fetchActivities() {

            const container = document.getElementById('activitiesContainer');

            container.innerHTML = '<div class="loading"><div class="loading-spinner"></div></div>';

            

            try {

                // Get server ID from URL or use a default

                const serverId = (typeof window.getGuildIdFromPath === 'function' && window.getGuildIdFromPath()) || 'default';

                

                // Fetch activities from API

                const response = await fetch(`/api/activity/${serverId}`);

                const data = await response.json();

                

                // Response shape is { success, activity: { serverId, activities } }
                const activities = (data && data.activity && Array.isArray(data.activity.activities))
                    ? data.activity.activities
                    : (Array.isArray(data?.activities) ? data.activities : []);

                if (activities.length > 0) {

                    displayActivities(activities);

                } else {

                    container.innerHTML = '<div class="no-activities">No activities found for this server</div>';

                }

            } catch (error) {

                console.error('Error fetching activities:', error);

                container.innerHTML = '<div class="no-activities">Error loading activities. Please try again.</div>';

            }

        }

        

        // Function to display activities

        function displayActivities(activities) {

            const container = document.getElementById('activitiesContainer');

            container.innerHTML = '';

            

            activities.forEach(activity => {

                const activityItem = document.createElement('div');

                activityItem.className = 'activity-item';

                

                // Format timestamp

                const timestamp = new Date(activity.timestamp);

                const timeAgo = formatTimeAgo(timestamp);

                const formattedTime = timestamp.toLocaleString();

                

                // Extract action details — clean up raw JSON payloads into readable text

                let actionText = activity.action;

                let details = '';

                

                // Strip JSON payloads embedded in the action text (e.g. "UPDATED SETUP: {...}")

                const jsonMatch = activity.action.match(/\{[\s\S]*\}$/);

                if (jsonMatch) {

                    try {

                        const setupData = JSON.parse(jsonMatch[0]);

                        actionText = activity.action.replace(jsonMatch[0], '').trim();

                        // Friendly label mapping for common system actions

                        const clean = actionText.toLowerCase();

                        if (clean.startsWith('updated setup') || clean.startsWith('setup updated')) {

                            actionText = 'Server setup updated';

                            details = `Server: ${setupData.serverName || '—'} (${setupData.serverType || setupData.version || '—'})`;

                        } else if (clean.includes('mention')) {

                            details = setupData.mention || setupData.mentionType || '';

                        } else if (clean.includes('language')) {

                            details = setupData.language || '';

                        } else {

                            // Fallback: list first-level values up to 3 entries

                            const parts = Object.entries(setupData)

                                .filter(([, v]) => v != null && v !== '')

                                .slice(0, 3)

                                .map(([k, v]) => `${k}: ${typeof v === 'object' ? JSON.stringify(v) : v}`);

                            if (parts.length) details = parts.join(' · ');

                        }

                    } catch (e) {

                        // If JSON parsing fails, keep the original action text

                        actionText = activity.action.replace(jsonMatch[0], '').trim();

                    }

                }

                // Safety guard for empty text

                if (!actionText) actionText = activity.action || 'Activity';

                if (!activity.user) activity.user = 'System';

                

                activityItem.innerHTML = `

                    <div class="activity-user">

                        <div class="user-avatar">${activity.user.charAt(0).toUpperCase()}</div>

                        <div>${activity.user}</div>

                    </div>

                    <div class="activity-action">

                        <div class="action-icon">

                            <i class='bx bx-edit'></i>

                        </div>

                        <div class="action-text">

                            <div class="main-action">${actionText}</div>

                            ${details ? `<div class="details">${details}</div>` : ''}

                        </div>

                    </div>

                    <div class="activity-reason">${activity.reason}</div>

                    <div class="activity-timestamp">
                        <div class="main-time">${formattedTime}</div>
                        <div class="time-ago">${timeAgo}</div>
                    </div>

                `;

                

                container.appendChild(activityItem);

            });

        }

        

        // Helper function to format time ago

        function formatTimeAgo(date) {

            const seconds = Math.floor((new Date() - date) / 1000);

            

            let interval = Math.floor(seconds / 31536000);

            if (interval >= 1) return interval + " year" + (interval === 1 ? "" : "s") + " ago";

            

            interval = Math.floor(seconds / 2592000);

            if (interval >= 1) return interval + " month" + (interval === 1 ? "" : "s") + " ago";

            

            interval = Math.floor(seconds / 86400);

            if (interval >= 1) return interval + " day" + (interval === 1 ? "" : "s") + " ago";

            

            interval = Math.floor(seconds / 3600);

            if (interval >= 1) return interval + " hour" + (interval === 1 ? "" : "s") + " ago";

            

            interval = Math.floor(seconds / 60);

            if (interval >= 1) return interval + " minute" + (interval === 1 ? "" : "s") + " ago";

            

            return Math.floor(seconds) + " second" + (seconds === 1 ? "" : "s") + " ago";

        }

    </script>
