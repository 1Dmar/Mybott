<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modules — ProMcBot</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"><link rel="stylesheet" href="/shared.css">
  <style>
    .modules-page{max-width:1100px}.modules-header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.modules-header h1{margin:0 0 6px}.modules-header p{margin:0;color:var(--text-muted)}
    .modules-note{margin-bottom:16px;padding:12px 14px;border-left:3px solid var(--primary);border-radius:10px;background:var(--primary-soft);color:var(--text-secondary);font-size:12px}.modules-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.module-card{display:flex;align-items:flex-start;gap:12px;min-width:0;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm)}.module-icon{display:inline-flex;flex:0 0 38px;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);font-size:20px}.module-body{flex:1;min-width:0}.module-body h2{margin:0 0 4px;font-size:15px}.module-body p{margin:0;color:var(--text-muted);font-size:12px}.module-status{display:inline-flex;align-items:center;gap:5px;margin-top:10px;color:var(--text-muted);font-size:11px;font-weight:750}.module-status.enabled{color:var(--success)}.module-status.pending{color:var(--warning)}.module-action{flex:0 0 auto;color:var(--primary);font-size:12px;font-weight:750;text-decoration:none}.module-action:hover{color:var(--primary-strong)}.module-toggle{flex:0 0 auto;min-height:32px;padding:7px 10px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:11px;font-weight:750;cursor:pointer}.module-toggle:hover{border-color:var(--primary);color:var(--primary)}.module-toggle:disabled{cursor:wait;opacity:.6}.state{padding:28px;color:var(--text-muted);text-align:center}.state.error{color:var(--danger)}
    @media(max-width:680px){.modules-header{display:block}.modules-grid{grid-template-columns:1fr}.module-card{padding:14px}}
  </style>
</head>
<body class="dark">
  <nav class="navbar"><div class="logo_item"><i class="bx bx-menu" id="sidebarToggle" aria-label="Open navigation"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div><div class="navbar_content"><div id="darkLight" role="button" tabindex="0" aria-label="Toggle theme"><i class="bx bx-sun"></i></div><img src="" class="user-avatar" data-user-avatar id="userBtn" alt="Account"></div></nav>
  <nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span><i class="bx bx-x" id="sidebar-close" aria-label="Close navigation"></i></div><div class="menu_container"><div class="menu_content"></div><div class="sidebar-footer"><div class="sidebar_profile flex"><span class="nav_image"><img src="" alt="Account" data-user-avatar></span><div class="data_text"><span class="name" data-user-name>User</span><span class="email" data-user-id>ID</span></div></div></div></div></nav>
  <main class="main-content"><section class="modules-page"><header class="modules-header"><div><div class="eyebrow">Server control</div><h1>Modules</h1><p>Turn on the tools this server actually needs.</p></div><a class="button-secondary" href="/myservers"><i class="bx bx-left-arrow-alt"></i> My servers</a></header><div class="modules-note"><strong>How this works:</strong> module switches update the bot configuration. Minecraft player data and remote commands require the connected plugin.</div><div id="modulesGrid" class="modules-grid"><div class="state">Loading module status…</div></div></section></main>
  <script src="/shared.js"></script>
  <script>
    (() => { const match=window.location.pathname.match(/\/myservers\/([^/]+)/); const guildId=match?.[1]; const grid=document.getElementById('modulesGrid'); const esc=value=>{const node=document.createElement('span');node.textContent=String(value??'');return node.innerHTML}; const icons={autoResponder:'bx-message-square-dots',welcomeMessages:'bx-user-plus',moderation:'bx-shield-quarter',logs:'bx-history',tickets:'bx-support',serverStatus:'bx-server',minecraftPlugin:'bx-plug'}; function render(modules){grid.innerHTML=modules.map(module=>{const action=module.toggleable?`<button class="module-toggle" data-module-id="${esc(module.id)}" data-enabled="${module.enabled}">${module.enabled?'Disable':'Enable'}</button>`:module.href?`<a class="module-action" href="${esc(module.href)}">Connect</a>`:'';return `<article class="module-card"><span class="module-icon"><i class="bx ${icons[module.id]||'bx-cube'}"></i></span><div class="module-body"><h2>${esc(module.label)}</h2><p>${esc(module.description)}</p><span class="module-status ${module.enabled?'enabled':module.configured?'':'pending'}"><span class="status-dot ${module.enabled?'good':'warn'}"></span>${esc(module.statusLabel|| (module.enabled?'Enabled':'Not configured'))}</span></div>${action}</article>`}).join('');grid.querySelectorAll('[data-module-id]').forEach(button=>button.addEventListener('click',()=>toggle(button)))} async function toggle(button){button.disabled=true;try{const response=await fetch(`/api/guilds/${encodeURIComponent(guildId)}/modules/${encodeURIComponent(button.dataset.moduleId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({enabled:button.dataset.enabled!=='true'})});if(!response.ok)throw new Error('Module update failed');await load()}catch(error){button.disabled=false;window.showToast(error.message,'error')}} async function load(){if(!guildId){grid.innerHTML='<div class="state error">No managed server selected.</div>';return}try{const response=await fetch(`/api/guilds/${encodeURIComponent(guildId)}/modules`,{credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Modules unavailable');render(data.modules||[])}catch(error){grid.innerHTML=`<div class="state error">${esc(error.message)}.</div>`}} load()})();
  </script>
</body>
</html>
