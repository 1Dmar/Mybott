<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modules - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=13">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
  <!-- NAVBAR -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> Notifications</div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> My Profile</a>
          <a href="/my-servers"><i class='bx bx-server'></i> My Servers</a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers" data-i18n="not.servers"><a> <span class="sep">/</span> <span id="breadServerName" data-i18n="pg.loading"><span> <span class="sep">/</span> <span data-i18n="not.modules"><span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-grid-alt'></i></div>
            <div>
                <h1 class="page-title" data-i18n="not.modules"><h1>
                <p class="page-subtitle">Enable or disable bot features for your server.</p>
            </div>
        </div>

        <div class="modules-grid" id="modulesGrid">
            <!-- Dynamically populated -->
        </div>
    </main>

    <script src="/i18n.js?v=12"></script>
  <script src="/shared.js?v=13"></script>
    <script>
        const guildId = window.getGuildIdFromPath() || (window.location.pathname.match(/\/my-servers\/(\d+)/) || [])[1] || '';
        if (!guildId) {
          Swal.fire('Error', 'Server ID not found in the URL. Please go back to My Servers and open this server again.', 'error');
          throw new Error('Page guard triggered: missing context.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadData();
        });

        async function loadData() {
            try {
                const res = await fetch(`/api/server/${guildId}/modules`);
                const data = await res.json();
                if (data.success && data.modules) {
                    renderModules(data.modules);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderModules(modules) {
            const grid = document.getElementById('modulesGrid');
            const configs = [
                { key: 'autoResponder', title: 'Auto Responder', desc: 'Automatically reply to common phrases.', icon: 'bx-message-square-dots' },
                { key: 'welcomeMessages', title: 'Welcome Messages', desc: 'Greet new members when they join.', icon: 'bx-user-plus' },
                { key: 'moderation', title: 'Moderation', desc: 'Keep your server safe with automod.', icon: 'bx-shield-quarter' },
                { key: 'logs', title: 'Server Logs', desc: 'Log server events securely.', icon: 'bx-book-content' },
                { key: 'tickets', title: 'Tickets', desc: 'Support ticket system for users.', icon: 'bx-support' },
                { key: 'serverStatus', title: 'Server Status', desc: 'Show Minecraft server status.', icon: 'bx-server' }
            ];

            grid.innerHTML = '';
            configs.forEach(conf => {
                const isEnabled = modules[conf.key];
                
                const card = document.createElement('div');
                card.className = `module-card ${isEnabled ? 'active' : ''}`;
                
                card.innerHTML = `
                    <div class="module-card-icon">
                        <i class='bx ${conf.icon}'></i>
                    </div>
                    <div class="module-card-body">
                        <div class="module-card-title">${conf.title}</div>
                        <div class="module-card-desc">${conf.desc}</div>
                        <div class="module-card-toggle">
                            <label class="module-switch">
                                <input type="checkbox" id="mod_${conf.key}" ${isEnabled ? 'checked' : ''} onchange="toggleModule('${conf.key}', this.checked)">
                                <span class="module-switch-slider"></span>
                            </label>
                            <span id="status_${conf.key}" class="${isEnabled ? 'on' : ''}">${isEnabled ? 'Enabled' : 'Disabled'}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function toggleModule(key, state) {
            // Optimistic update of UI
            const card = document.getElementById(`mod_${key}`).closest('.module-card');
            const statusText = document.getElementById(`status_${key}`);
            if (state) {
                card.classList.add('active');
                statusText.classList.add('on');
                statusText.textContent = 'Enabled';
            } else {
                card.classList.remove('active');
                statusText.classList.remove('on');
                statusText.textContent = 'Disabled';
            }

            // Make request
            try {
                // Get current state
                const res = await fetch(`/api/server/${guildId}/modules`);
                const data = await res.json();
                const updatedModules = { ...data.modules, [key]: state };

                const postRes = await fetch(`/api/server/${guildId}/modules`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedModules)
                });
                
                if (!postRes.ok) throw new Error('Save failed');
            } catch (err) {
                console.error('Failed to save module', err);
                Swal.fire('Error', 'Failed to save settings', 'error');
                // Revert
                loadData();
            }
        }
    </script>
</body>
</html>
