<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Responder - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=14">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .responder-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .responder-trigger {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 15px;
        }
        .responder-response {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--surface-2);
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            flex: 1;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
  <!-- NAVBAR -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> Notifications</div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> My Profile</a>
          <a href="/my-servers"><i class='bx bx-server'></i> My Servers</a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers" data-i18n="not.servers"><a> <span class="sep">/</span> <span id="breadServerName" data-i18n="pg.loading"><span> <span class="sep">/</span> <span data-i18n="nav.auto_responder"><span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-message-dots'></i></div>
            <div>
                <h1 class="page-title" data-i18n="nav.auto_responder"><h1>
                <p class="page-subtitle">Automatically reply to specific trigger words or phrases.</p>
            </div>
        </div>

        <div class="card animated" style="margin-bottom: 24px;">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-plus'></i></div>
                <div>
                    <h2 class="card-title" data-i18n="pg.add_auto_responder"></h2>
                    <p class="card-subtitle">Create a new trigger and response combination.</p>
                </div>
            </div>

            <form id="addResponderForm">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Trigger Word / Phrase <span class="required">*</span></label>
                        <input type="text" class="form-control" id="triggerInput" placeholder="e.g. !ip" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bot Response <span class="required">*</span></label>
                        <textarea class="form-control" id="responseInput" placeholder="e.g. play.example.com" required style="min-height: 40px; height: 40px;"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="addBtn"><i class='bx bx-save'></i> Add Responder</button>
            </form>
        </div>

        <h3 style="margin-bottom: 16px; font-size: 16px;">Active Responders</h3>
        <div class="grid-auto animated" id="respondersGrid" style="animation-delay: 0.1s;">
            <!-- Loading -->
            <div class="card"><div class="skeleton" style="height: 100px;"></div></div>
            <div class="card"><div class="skeleton" style="height: 100px;"></div></div>
        </div>

    </main>

    <script src="/i18n.js?v=12"></script>
  <script src="/shared.js?v=14"></script>
    <script>
        const guildId = window.getGuildIdFromPath() || (window.location.pathname.match(/\/my-servers\/(\d+)/) || [])[1] || '';
        if (!guildId) {
          Swal.fire('Error', 'Server ID not found in the URL. Please go back to My Servers and open this server again.', 'error');
          throw new Error('Page guard triggered: missing context.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadResponders();

            document.getElementById('addResponderForm').addEventListener('submit', addResponder);
        });

        async function loadResponders() {
            try {
                const res = await fetch(`/api/server/${guildId}/autoresponder`);
                const data = await res.json();
                const container = document.getElementById('respondersGrid');
                container.innerHTML = '';

                let responders = [];
                if (data.success && Array.isArray(data.items)) {
                    responders = data.items;
                } else if (Array.isArray(data)) {
                    responders = data;
                }

                if (responders.length === 0) {
                    container.innerHTML = `
                        <div class="card" style="grid-column: 1 / -1;">
                            <div class="alert alert-info" style="margin: 0;">
                                <i class='bx bx-info-circle'></i> No auto responders configured yet.
                            </div>
                        </div>
                    `;
                    throw new Error('Page guard triggered: missing context.');
                }

                responders.forEach(r => {
                    const card = document.createElement('div');
                    card.className = 'card responder-card';
                    // We assume r.id or r._id
                    const rId = r.id || r._id;
                    card.innerHTML = `
                        <div>
                            <div class="responder-trigger"><i class='bx bx-purchase-tag'></i> ${r.trigger}</div>
                            <div class="responder-response">${r.response}</div>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="deleteResponder('${rId}')">
                            <i class='bx bx-trash'></i> Delete
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('respondersGrid').innerHTML = `
                    <div class="card" style="grid-column: 1 / -1;">
                        <div class="alert alert-danger" style="margin: 0;"><i class='bx bx-error-circle'></i> Failed to load responders.</div>
                    </div>
                `;
            }
        }

        async function addResponder(e) {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Adding...`;
            btn.disabled = true;

            const trigger = document.getElementById('triggerInput').value.trim();
            const response = document.getElementById('responseInput').value.trim();

            try {
                const res = await fetch(`/api/server/${guildId}/autoresponder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trigger, response })
                });

                const data = await res.json();

                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Added!', text: 'Auto responder added successfully', timer: 1500, showConfirmButton: false });
                    document.getElementById('triggerInput').value = '';
                    document.getElementById('responseInput').value = '';
                    loadResponders();
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to add auto responder' });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Network error occurred' });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function deleteResponder(id) {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "This responder will be deleted.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Yes, delete it!'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`/api/server/${guildId}/autoresponder/${id}`, {
                        method: 'DELETE'
                    });

                    if (res.ok) {
                        Swal.fire({ icon: 'success', title: 'Deleted!', text: 'Auto responder has been removed.', timer: 1500, showConfirmButton: false });
                        loadResponders();
                    } else {
                        const data = await res.json();
                        Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to delete' });
                    }
                } catch (error) {
                    console.error(error);
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Network error occurred' });
                }
            }
        }
    </script>
</body>
</html>
