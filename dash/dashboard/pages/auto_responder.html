<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Responder - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .responder-card {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }
        .responder-trigger {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 15px;
        }
        .responder-response {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--surface-2);
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
            flex: 1;
            white-space: pre-wrap;
        }
    </style>
  <!-- ProMcBot SEO and social metadata -->
  <meta data-promcbot-metadata="1" name="description" content="Auto Responder for the ProMcBot Discord and Minecraft management dashboard.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://promcbot.dev/dashboard">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ProMcBot">
  <meta property="og:title" content="Auto Responder — ProMcBot Dashboard">
  <meta property="og:description" content="Auto Responder for the ProMcBot Discord and Minecraft management dashboard.">
  <meta property="og:url" content="https://promcbot.dev/dashboard">
  <meta property="og:image" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:secure_url" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1983">
  <meta property="og:image:height" content="793">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Auto Responder — ProMcBot Dashboard">
  <meta name="twitter:description" content="Auto Responder for the ProMcBot Discord and Minecraft management dashboard.">
  <meta name="twitter:image" content="https://promcbot.dev/dashboard/share-preview.png">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/myservers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Auto Responder</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-message-dots'></i></div>
            <div>
                <h1 class="page-title">Auto Responder</h1>
                <p class="page-subtitle">Automatically reply to specific trigger words or phrases.</p>
            </div>
        </div>

        <div class="card animated" style="margin-bottom: 24px;">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-plus'></i></div>
                <div>
                    <h2 class="card-title">Add New Auto Responder</h2>
                    <p class="card-subtitle">Create a new trigger and response combination.</p>
                </div>
            </div>

            <form id="addResponderForm">
                <div class="grid-2">
                    <div class="form-group">
                        <label class="form-label">Trigger Word / Phrase <span class="required">*</span></label>
                        <input type="text" class="form-control" id="triggerInput" placeholder="e.g. !ip" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Bot Response <span class="required">*</span></label>
                        <textarea class="form-control" id="responseInput" placeholder="e.g. play.example.com" required style="min-height: 40px; height: 40px;"></textarea>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="addBtn"><i class='bx bx-save'></i> Add Responder</button>
            </form>
        </div>

        <h3 style="margin-bottom: 16px; font-size: 16px;">Active Responders</h3>
        <div class="grid-auto animated" id="respondersGrid" style="animation-delay: 0.1s;">
            <!-- Loading -->
            <div class="card"><div class="skeleton" style="height: 100px;"></div></div>
            <div class="card"><div class="skeleton" style="height: 100px;"></div></div>
        </div>

    </main>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadResponders();

            document.getElementById('addResponderForm').addEventListener('submit', addResponder);
        });

        async function loadResponders() {
            try {
                const res = await fetch(`/api/server/${guildId}/autoresponder`);
                const data = await res.json();
                const container = document.getElementById('respondersGrid');
                container.innerHTML = '';

                let responders = [];
                if (data.success && Array.isArray(data.items)) {
                    responders = data.items;
                } else if (Array.isArray(data)) {
                    responders = data;
                }

                if (responders.length === 0) {
                    container.innerHTML = `
                        <div class="card" style="grid-column: 1 / -1;">
                            <div class="alert alert-info" style="margin: 0;">
                                <i class='bx bx-info-circle'></i> No auto responders configured yet.
                            </div>
                        </div>
                    `;
                    return;
                }

                responders.forEach(r => {
                    const card = document.createElement('div');
                    card.className = 'card responder-card';
                    // We assume r.id or r._id
                    const rId = r.id || r._id;
                    card.innerHTML = `
                        <div>
                            <div class="responder-trigger"><i class='bx bx-purchase-tag'></i> ${r.trigger}</div>
                            <div class="responder-response">${r.response}</div>
                        </div>
                        <button class="btn btn-danger btn-sm" onclick="deleteResponder('${rId}')">
                            <i class='bx bx-trash'></i> Delete
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('respondersGrid').innerHTML = `
                    <div class="card" style="grid-column: 1 / -1;">
                        <div class="alert alert-danger" style="margin: 0;"><i class='bx bx-error-circle'></i> Failed to load responders.</div>
                    </div>
                `;
            }
        }

        async function addResponder(e) {
            e.preventDefault();
            const btn = document.getElementById('addBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Adding...`;
            btn.disabled = true;

            const trigger = document.getElementById('triggerInput').value.trim();
            const response = document.getElementById('responseInput').value.trim();

            try {
                const res = await fetch(`/api/server/${guildId}/autoresponder`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ trigger, response })
                });

                const data = await res.json();

                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Added!', text: 'Auto responder added successfully', timer: 1500, showConfirmButton: false });
                    document.getElementById('triggerInput').value = '';
                    document.getElementById('responseInput').value = '';
                    loadResponders();
                } else {
                    Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to add auto responder' });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Network error occurred' });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        async function deleteResponder(id) {
            const result = await Swal.fire({
                title: 'Are you sure?',
                text: "This responder will be deleted.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#6b7280',
                confirmButtonText: 'Yes, delete it!'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`/api/server/${guildId}/autoresponder/${id}`, {
                        method: 'DELETE'
                    });

                    if (res.ok) {
                        Swal.fire({ icon: 'success', title: 'Deleted!', text: 'Auto responder has been removed.', timer: 1500, showConfirmButton: false });
                        loadResponders();
                    } else {
                        const data = await res.json();
                        Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to delete' });
                    }
                } catch (error) {
                    console.error(error);
                    Swal.fire({ icon: 'error', title: 'Error', text: 'Network error occurred' });
                }
            }
        }
    </script>
</body>
</html>
