<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Public profile · ProMcBot</title>
  <style>
    :root{color-scheme:dark;--bg:#080a11;--panel:#121725;--line:#273047;--muted:#8c98ae;--text:#f5f7fb;--purple:#8b5cf6;--blue:#35c8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;color:var(--text);font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#261650 0,transparent 31rem),radial-gradient(circle at 100% 90%,#0b3546 0,transparent 28rem),var(--bg)}.wrap{width:min(670px,100%)}.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;font-size:13px;color:#b9c2d5}.brand a{color:inherit;text-decoration:none;border:1px solid var(--line);padding:8px 11px;border-radius:10px}.card{border:1px solid var(--line);border-radius:26px;background:linear-gradient(145deg,#171d2eea,#0e121eea);padding:30px;box-shadow:0 28px 90px #0006;position:relative;overflow:hidden}.card:before{content:"";position:absolute;width:280px;height:280px;right:-120px;top:-120px;border-radius:50%;background:linear-gradient(135deg,#8b5cf633,#35c8ff22);filter:blur(4px)}.identity{display:flex;align-items:center;gap:18px;position:relative}.avatar{width:88px;height:88px;border-radius:28px;object-fit:cover;background:#20283a;border:3px solid #ffffff18}.kicker{font-size:11px;color:var(--blue);letter-spacing:.14em;text-transform:uppercase;font-weight:800}.name{font-size:clamp(26px,6vw,42px);letter-spacing:-.05em;margin:6px 0 4px;line-height:1}.handle{color:var(--muted);font-size:13px}.badge{display:inline-flex;margin-top:8px;padding:5px 9px;border-radius:999px;background:#8b5cf61c;color:#cbbcff;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:26px;position:relative}.tile{border:1px solid var(--line);border-radius:15px;padding:15px;background:#ffffff05}.tile small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.tile strong{display:block;margin-top:7px;font-size:16px}.note{position:relative;margin:19px 0 0;color:#aab5c8;line-height:1.6;font-size:13px}.error{text-align:center;padding:30px}.error h1{margin:0 0 8px}.error p{color:var(--muted);line-height:1.6}footer{text-align:center;color:#69758a;font-size:11px;margin-top:17px}@media(max-width:450px){.card{padding:22px}.identity{align-items:flex-start}.avatar{width:70px;height:70px;border-radius:21px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap"><div class="brand"><a href="/">ProMcBot</a><a href="/stats">Public Stats</a></div><section class="card" id="card"><div class="error"><h1>Loading profile</h1><p>Fetching only the public Discord identity for this profile.</p></div></section><footer>Public profile · no private guild membership or raw activity is displayed.</footer></main>
<script>
const id=location.pathname.split('/').filter(Boolean).pop();
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{const r=await fetch('/api/public/profile/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error();const p=d.profile;document.getElementById('card').innerHTML='<div class="identity"><img class="avatar" src="'+esc(p.avatar)+'" alt=""><div><div class="kicker">Public Discord profile</div><div class="name">'+esc(p.globalName)+'</div><div class="handle">@'+esc(p.username)+'</div>'+(p.bot?'<span class="badge">BOT ACCOUNT</span>':'')+'</div></div><div class="grid"><div class="tile"><small>Profile ID</small><strong>'+esc(p.id)+'</strong></div><div class="tile"><small>Data source</small><strong>Discord public profile</strong></div></div><p class="note">This card deliberately stays small and privacy-safe. ProMcBot does not invent levels, XP, or player rankings when no published dataset exists.</p>';}catch(e){document.getElementById('card').innerHTML='<div class="error"><h1>Profile unavailable</h1><p>This public profile could not be found or is not available through the connected Discord client.</p></div>';}})();
</script></body></html>
