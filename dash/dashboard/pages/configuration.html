<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
            color: var(--text);
        }
        .form-control {
            width: 100%;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-family: inherit;
            transition: var(--transition-fast);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            background: var(--surface);
        }
        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Configuration</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-cog'></i></div>
            <div>
                <h1 class="page-title">Configuration</h1>
                <p class="page-subtitle">Manage server-specific bot configuration.</p>
            </div>
        </div>

        <!-- Page Specific Content Here -->
        <div class="card" style="max-width: 600px;">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-bot'></i></div>
                <div>
                    <h2 class="card-title">Bot Profile</h2>
                    <p class="card-subtitle">Customize how the bot appears in this server</p>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="botNickname">Bot Nickname</label>
                <input type="text" id="botNickname" class="form-control" placeholder="ProMcBot">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="serverDescription">Server Description</label>
                <textarea id="serverDescription" class="form-control" placeholder="A great server powered by ProMcBot!"></textarea>
            </div>
        </div>

    </main>

    <!-- Save Bar -->
    <div class="save-bar" id="saveBar">
        <span class="save-bar-text">You have unsaved changes.</span>
        <button class="btn btn-primary" onclick="saveSettings()">Save Changes</button>
    </div>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        let originalConfig = {};

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            
            // Set up dirty checking
            const inputs = ['botNickname', 'serverDescription'];
            inputs.forEach(id => {
                document.getElementById(id).addEventListener('input', checkChanges);
            });
            
            loadData();
        });

        async function loadData() {
            try {
                const response = await fetch(`/api/server/${guildId}/config`);
                const data = await response.json();
                
                if (data.success && data.config) {
                    originalConfig = {
                        nickname: data.config.nickname || '',
                        description: data.config.description || ''
                    };
                    
                    document.getElementById('botNickname').value = originalConfig.nickname;
                    document.getElementById('serverDescription').value = originalConfig.description;
                } else {
                    Swal.fire('Error', 'Failed to load configuration', 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'An error occurred while fetching configuration', 'error');
            }
        }
        
        function checkChanges() {
            const currentNickname = document.getElementById('botNickname').value;
            const currentDescription = document.getElementById('serverDescription').value;
            
            if (currentNickname !== originalConfig.nickname || currentDescription !== originalConfig.description) {
                document.getElementById('saveBar').classList.add('show');
            } else {
                document.getElementById('saveBar').classList.remove('show');
            }
        }
        
        async function saveSettings() {
            const nickname = document.getElementById('botNickname').value;
            const description = document.getElementById('serverDescription').value;
            
            try {
                const response = await fetch(`/api/server/${guildId}/config`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nickname, description })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    originalConfig = { nickname, description };
                    document.getElementById('saveBar').classList.remove('show');
                    Swal.fire({
                        icon: 'success',
                        title: 'Saved!',
                        text: 'Configuration has been updated successfully.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Error', data.error || 'Failed to save configuration', 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'An error occurred while saving configuration', 'error');
            }
        }
    </script>
</body>
</html>
