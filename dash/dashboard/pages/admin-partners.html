<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partners Admin · ProMcBot</title><link rel="stylesheet" href="/dashboard/style.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head><body><nav class="navbar"><div class="logo_item"><i class="bx bx-menu" id="sidebarToggle"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div></nav><nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span></div><div class="menu_container"><div class="menu_content"></div></div></nav><main class="dashboard-main"><section class="card"><p class="eyebrow">ADMINISTRATION</p><h1>Partners</h1><div id="applications">Loading applications…</div><h2>Active partnerships</h2><div id="partners">Loading partners…</div></section></main><script src="/shared.js"></script><script>(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const api=async u=>{const r=await fetch(u);const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};const render=async()=>{const a=await api('/api/admin/partners/applications');document.querySelector('#applications').innerHTML=(a.applications||[]).map(x=>`<article class="entry-row"><div><h3>${esc(x.information.communityName)}</h3><p>${esc(x.information.discordUsername)} · ${esc(x.status)} · ${esc(x.information.description)}</p></div><div class="row-actions">${['PENDING','UNDER_REVIEW'].includes(x.status)?`<button class="button primary" data-action="approve" data-id="${x._id}">Approve</button><button class="button secondary" data-action="review" data-id="${x._id}">Review</button>`:''}</div></article>`).join('')||'<p>No applications.</p>';const p=await api('/api/admin/partners');document.querySelector('#partners').innerHTML=(p.partners||[]).map(x=>`<article class="entry-row"><div><h3>${esc(x.userId)}</h3><p>${esc(x.status)} · expires ${esc(x.expiresAt)}</p></div><div class="row-actions"><button class="button secondary" data-action="renew" data-id="${x._id}">Renew 90 days</button><button class="button danger" data-action="end" data-id="${x._id}">End</button></div></article>`).join('')||'<p>No active partners.</p>'};document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const id=encodeURIComponent(b.dataset.id),a=b.dataset.action;const u=a==='approve'?`/api/admin/partners/applications/${id}/approve`:a==='review'?`/api/admin/partners/applications/${id}/review`:a==='renew'?`/api/admin/partners/${id}/renew`:`/api/admin/partners/${id}/end`;await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});render()});render().catch(e=>document.querySelector('#applications').textContent=e.message)})();</script></body></html>
