<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partners Admin · ProMcBot</title><link rel="stylesheet" href="/shared.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head>
<body><nav class="navbar"><div class="logo_item"><i class="bx bx-menu" id="sidebarToggle"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div></nav>
<nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span></div><div class="menu_container"><div class="menu_content"></div></div></nav>
<main class="dashboard-main"><section class="card"><p class="eyebrow">ADMINISTRATION</p><h1>Partner management</h1><div id="stats" class="entry-row">Loading statistics…</div><div id="tabs" class="row-actions"></div><div id="content">Loading…</div></section></main>
<script src="/shared.js"></script><script>
(async()=>{const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s).toLocaleString(): '—';const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d};let tab='PENDING';
const render=async()=>{const [apps,partners]=await Promise.all([api('/api/admin/partners/applications?status='+encodeURIComponent(tab==='ACTIVE'?'APPROVED':tab)),api('/api/admin/partners')]);const c=partners.stats||{};document.querySelector('#stats').innerHTML=`<div><b>Pending</b> ${c.PENDING||0} · <b>Active</b> ${(partners.partners||[]).filter(x=>x.status==='ACTIVE').length} · <b>Approved</b> ${c.APPROVED||0} · <b>Rejected</b> ${c.REJECTED||0} · <b>Ended</b> ${(partners.partners||[]).filter(x=>x.status==='ENDED').length}</div>`;
const isPartners=tab==='ACTIVE'||tab==='ENDED';const rows=isPartners?(partners.partners||[]).filter(x=>x.status===tab):apps.applications||[];document.querySelector('#content').innerHTML=rows.map(x=>isPartners?`<article class="entry-row"><div><h3>${esc(x.userId)}</h3><p>${esc(x.status)} · started ${esc(fmt(x.startedAt))} · expires ${esc(fmt(x.expiresAt))} · discount ${x.discountActive?esc(x.discountPercentage)+'%':'inactive'}</p></div><div class="row-actions"><button class="button secondary" data-action="detail" data-id="${x._id}">Details</button>${x.status==='ACTIVE'?`<button class="button secondary" data-action="renew" data-id="${x._id}">Renew 90 days</button><button class="button danger" data-action="end" data-id="${x._id}">End</button>`:''}</div></article>`:`<article class="entry-row"><div><h3>${esc(x.information?.communityName)}</h3><p>${esc(x.information?.discordUsername)} · ${esc(x.status)} · submitted ${esc(fmt(x.submittedAt))}</p><p>${esc(x.information?.description)}</p></div><div class="row-actions"><button class="button secondary" data-action="detail-app" data-id="${x._id}">Open</button>${['PENDING','UNDER_REVIEW'].includes(x.status)?`<button class="button secondary" data-action="review" data-id="${x._id}">Under review</button><button class="button primary" data-action="approve" data-id="${x._id}">Approve</button><button class="button danger" data-action="reject" data-id="${x._id}">Reject</button>`:''}</div></article>`).join('')||'<p>No records in this section.</p>';
document.querySelector('#tabs').innerHTML=['PENDING','UNDER_REVIEW','APPROVED','REJECTED','ACTIVE','ENDED'].map(t=>`<button class="button ${tab===t?'primary':'secondary'}" data-tab="${t}">${t.replace('_',' ')}</button>`).join('');};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.tab){tab=b.dataset.tab;return render()}const id=encodeURIComponent(b.dataset.id);if(b.dataset.action==='detail'||b.dataset.action==='detail-app'){const d=await api(b.dataset.action==='detail'?`/api/admin/partners/${id}`:`/api/admin/partners/applications/${id}`);alert(JSON.stringify(d,b.dataset.action==='detail'?null: null,2));return}let u='',body={};if(b.dataset.action==='approve')u=`/api/admin/partners/applications/${id}/approve`;if(b.dataset.action==='review'){u=`/api/admin/partners/applications/${id}/review`;body={adminNotes:prompt('Admin notes')||''};}if(b.dataset.action==='reject'){u=`/api/admin/partners/applications/${id}/reject`;body={rejectionReason:prompt('Rejection reason')||''};}if(b.dataset.action==='renew')u=`/api/admin/partners/${id}/renew`;if(b.dataset.action==='end'){u=`/api/admin/partners/${id}/end`;body={reason:prompt('End reason')||''};}if(u){await api(u,{method:'POST',body:JSON.stringify(body)});await render();}}catch(err){alert(err.message)}});render().catch(e=>document.querySelector('#content').textContent=e.message)})();
</script></body></html>
