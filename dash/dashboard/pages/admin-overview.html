<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            color: var(--text-color);
        }
        .action-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .action-card i {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--primary-color);
        }
        .action-card h3 {
            font-size: 16px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <span>Admin</span> <span class="sep">/</span> <span>Overview</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-shield-quarter'></i></div>
            <div>
                <h1 class="page-title">Admin Panel</h1>
                <p class="page-subtitle">Overview of bot statistics and quick administrative actions.</p>
            </div>
        </div>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(0, 123, 255, 0.1); color: #007bff;"><i class='bx bx-group'></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Users</p>
                    <h3 class="stat-value" id="statUsers">...</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(111, 66, 193, 0.1); color: #6f42c1;"><i class='bx bx-server'></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Servers</p>
                    <h3 class="stat-value" id="statServers">...</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(40, 167, 69, 0.1); color: #28a745;"><i class='bx bx-support'></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Tickets</p>
                    <h3 class="stat-value" id="statTickets">...</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(253, 126, 20, 0.1); color: #fd7e14;"><i class='bx bx-list-ul'></i></div>
                <div class="stat-info">
                    <p class="stat-label">Total Logs</p>
                    <h3 class="stat-value" id="statLogs">...</h3>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(40, 167, 69, 0.1); color: #28a745;"><i class='bx bx-time'></i></div>
                <div class="stat-info">
                    <p class="stat-label">Uptime</p>
                    <h3 class="stat-value" id="statUptime">...</h3>
                </div>
            </div>
        </div>

        <h2 style="margin-top: 30px; margin-bottom: 10px;">Quick Actions</h2>
        <div class="quick-actions">
            <a href="/admin/email" class="action-card">
                <i class='bx bx-envelope'></i>
                <h3>Send Email</h3>
            </a>
            <a href="/admin/users" class="action-card">
                <i class='bx bx-user-circle'></i>
                <h3>Manage Users</h3>
            </a>
            <a href="/admin/stats" class="action-card">
                <i class='bx bx-bar-chart-alt-2'></i>
                <h3>Statistics</h3>
            </a>
            <a href="/admin/bugs" class="action-card">
                <i class='bx bx-bug'></i>
                <h3>Bug Reports</h3>
            </a>
            <a href="/admin/sendembed" class="action-card">
                <i class='bx bx-message-square-detail'></i>
                <h3>Send Embed</h3>
            </a>
        </div>
    </main>

    <script src="/shared.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            loadStats();
        });

        function formatUptime(seconds) {
            if (!seconds || isNaN(seconds)) return '00:00:00';
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats', {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const stats = data.stats || {};
                    
                    document.getElementById('statUsers').textContent = stats.totalUsers || 0;
                    document.getElementById('statServers').textContent = stats.totalServers || 0;
                    document.getElementById('statTickets').textContent = stats.totalTickets || 0;
                    document.getElementById('statLogs').textContent = stats.totalLogs || 0;
                    document.getElementById('statUptime').textContent = formatUptime(stats.uptime);
                }
            } catch (error) {
                console.error("Failed to fetch admin stats:", error);
            }
        }
    </script>
</body>
</html>
