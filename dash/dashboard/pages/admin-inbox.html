<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support Inbox · ProMcBot</title><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/dashboard/admin-shell.css"><link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"><style>
 body{min-height:100vh;overflow-x:hidden}.wrap{width:min(1180px,calc(100% - 28px));min-width:0;margin:0 auto 60px}.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--border);margin-bottom:20px}.brand{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:900;text-decoration:none}.brand img{width:34px;height:34px;border-radius:10px}.brand em{color:var(--primary);font-style:normal}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{padding:8px 11px;border-radius:9px;color:var(--text-muted);font-size:12px;font-weight:800;text-decoration:none}.links a:hover,.links a.active{background:var(--primary-soft);color:var(--primary)}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:15px;min-width:0}.card,.item{min-width:0;border:1px solid var(--border);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-sm)}.card{padding:18px}.list{display:grid;gap:8px;max-height:650px;overflow:auto}.item{padding:13px;cursor:pointer}.item.active{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}.item h3{margin:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item p{margin:5px 0 0;color:var(--text-muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;gap:8px;margin-top:8px;color:var(--text-muted);font-size:10px}.badge{padding:3px 7px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:800}.message-list{display:grid;gap:12px;max-height:500px;min-width:0;overflow:auto}.message{min-width:0;padding:14px;border-radius:13px;background:var(--surface-2);border:1px solid var(--border)}.message.outbound{border-color:rgba(88,101,242,.35);background:var(--primary-soft)}.message-head{display:flex;justify-content:space-between;gap:10px;color:var(--text-muted);font-size:10px;min-width:0}.message strong{color:var(--text)}.message-body{min-width:0;margin-top:10px;font-size:13px;line-height:1.65;overflow-wrap:anywhere;word-break:break-word}.message-body iframe,.message-body img,.message-body video{display:block;max-width:100%;width:auto;height:auto}.message-body video{max-height:420px;border-radius:10px;background:#000}.attachments{display:grid;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}.attachment-preview{display:block;max-width:100%;border-radius:10px;border:1px solid var(--border);background:#000}.attachment-link{display:flex;align-items:center;gap:9px;min-width:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;color:var(--primary);font-size:12px;font-weight:800;text-decoration:none}.attachment-link span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reply{margin-top:16px}.reply textarea{width:100%;min-height:130px;padding:11px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text);font:inherit;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.button{border:0;border-radius:9px;padding:10px 13px;background:var(--primary);color:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.button.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}.empty{padding:28px;text-align:center;color:var(--text-muted);font-size:12px}@media(max-width:800px){.nav{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}.list{max-height:300px}.card{padding:14px}.message-list{max-height:none;overflow:visible}.message-body img,.message-body video{width:100%;max-height:none;object-fit:contain}.message-head{align-items:flex-start;flex-direction:column;gap:4px}.wrap{width:calc(100% - 20px);margin-bottom:28px}}
</style></head><body class="admin-custom-shell"><main class="wrap"><nav class="nav"><a class="brand" href="/"><img src="/dashboard/logo.png" alt="ProMcBot"><span>Pro<em>Mc</em>Bot</span></a><div class="links"><a class="active" href="/admin/inbox">Support Inbox</a><a href="/admin/email">Send Email</a><a href="/admin/test-lab">Test Lab</a><a href="/dashboard">Dashboard</a></div></nav><header><p style="color:var(--primary);font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase">Official support</p><h1 style="margin:6px 0;font-size:clamp(28px,5vw,46px)">Support Inbox</h1><p style="color:var(--text-muted);font-size:13px">Receive and reply to support@promcbot.dev without opening Gmail.</p></header><section class="layout" style="margin-top:18px"><aside class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:17px">Conversations</h2><button class="button secondary" id="refresh">Refresh</button></div><div class="list" id="conversationList" style="margin-top:14px"><div class="empty">Loading…</div></div></aside><section class="card"><div id="conversationHead" class="empty">Select a conversation.</div><div id="messageList" class="message-list"></div><form id="replyForm" class="reply" hidden><textarea id="replyText" required placeholder="Write your reply…"></textarea><div class="actions"><button class="button" type="submit">Reply from support@promcbot.dev</button><button class="button secondary" type="button" id="closeConversation">Close conversation</button></div><p id="notice" style="color:var(--text-muted);font-size:11px"></p></form></section></section></main><script src="/dashboard/admin-shell.js"></script><script src="/shared.js"></script><script>
(()=>{const $=id=>document.getElementById(id);const esc=v=>{const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML};const bodyText=m=>esc(m.text||String(m.html||'').replace(/<[^>]*>/g,' ')).replace(/\n/g,'<br>');const formatBytes=n=>{const size=Number(n)||0;return size<1024?`${size} B`:size<1048576?`${(size/1024).toFixed(1)} KB`:`${(size/1048576).toFixed(1)} MB`};const renderAttachments=items=>(Array.isArray(items)&&items.length)?`<div class="attachments" aria-label="Attachments">${items.map(a=>{const url=esc(a.url),name=esc(a.filename),type=String(a.contentType||'').toLowerCase();if(type.startsWith('image/'))return `<a href="${url}" target="_blank" rel="noopener"><img class="attachment-preview" src="${url}" alt="${name}" loading="lazy"></a>`;if(type.startsWith('video/'))return `<video class="attachment-preview" controls preload="metadata"><source src="${url}" type="${esc(type)}">Your browser cannot play this video.</video>`;return `<a class="attachment-link" href="${url}" target="_blank" rel="noopener"><i class="bx bx-paperclip"></i><span>${name}</span><small>${formatBytes(a.size)}</small></a>`}).join('')}</div>`:'';const fmt=v=>v?new Date(v).toLocaleString():'—';const api=async(url,opt={})=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Request failed');return d};let selected=null;let conversations=[];function renderList(){const list=$('conversationList');list.innerHTML=conversations.length?conversations.map(c=>`<article class="item ${selected===c._id?'active':''}" data-id="${esc(c._id)}"><h3>${esc(c.subject)}</h3><p>${esc(c.contactEmail)}</p><div class="meta"><span>${fmt(c.lastMessageAt)}</span><span class="badge">${esc(c.status)} · ${c.messageCount||0}</span></div></article>`).join(''):'<div class="empty">No conversations yet.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>loadConversation(x.dataset.id))}async function loadList(){try{const d=await api('/api/admin/support/conversations');conversations=d.conversations||[];renderList()}catch(e){$('conversationList').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}async function loadConversation(id){selected=id;renderList();try{const d=await api('/api/admin/support/conversations/'+encodeURIComponent(id));const c=d.conversation;$('conversationHead').innerHTML=`<div style="text-align:left"><h2 style="margin:0;font-size:19px">${esc(c.subject)}</h2><p style="margin:6px 0;color:var(--text-muted);font-size:12px">${esc(c.contactEmail)} · ${esc(c.status)} · ${c.messageCount||0} messages</p></div>`;$('messageList').innerHTML=(d.messages||[]).map(m=>`<article class="message ${m.direction==='outbound'?'outbound':''}"><div class="message-head"><span><strong>${m.direction==='outbound'?'ProMcBot Support':esc(m.fromEmail)}</strong></span><span>${fmt(m.receivedAt)}</span></div><div class="message-body">${bodyText(m)}${renderAttachments(m.attachments)}</div></article>`).join('');$('replyForm').hidden=false;$('closeConversation').textContent=c.status==='closed'?'Reopen conversation':'Close conversation';$('closeConversation').dataset.status=c.status==='closed'?'open':'closed'}catch(e){$('conversationHead').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}$('replyForm').onsubmit=async e=>{e.preventDefault();if(!selected)return;const b=e.submitter;b.disabled=true;$('notice').textContent='Sending…';try{await api('/api/admin/support/conversations/'+selected+'/reply',{method:'POST',body:JSON.stringify({text:$('replyText').value})});$('replyText').value='';$('notice').textContent='Sent from support@promcbot.dev.';await loadList();await loadConversation(selected)}catch(err){$('notice').textContent=err.message}finally{b.disabled=false}};$('closeConversation').onclick=async()=>{if(!selected)return;try{await api('/api/admin/support/conversations/'+selected,{method:'PATCH',body:JSON.stringify({status:$('closeConversation').dataset.status})});await loadList();await loadConversation(selected)}catch(e){$('notice').textContent=e.message}};$('refresh').onclick=loadList;loadList();setInterval(loadList,30000)})();
</script></body></html>
