<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Messages - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Welcome Messages</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-user-plus'></i></div>
            <div>
                <h1 class="page-title">Welcome Messages</h1>
                <p class="page-subtitle">Greet new members when they join your server.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-cog'></i></div>
                <div>
                    <div class="card-title">Welcome Settings</div>
                    <div class="card-subtitle">Configure where and how to greet users.</div>
                </div>
            </div>
            
            <div class="form-group" style="margin-bottom: 24px;">
                <label>Enable Welcome Messages</label>
                <div style="margin-top: 8px;">
                    <label class="module-switch">
                        <input type="checkbox" id="welcomeEnabled" onchange="showSaveBar()">
                        <span class="module-switch-slider"></span>
                    </label>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label for="welcomeChannel" style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text);">Welcome Channel</label>
                <select id="welcomeChannel" class="form-select-styled" onchange="showSaveBar()" style="width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); background-color: var(--surface-2); color: var(--text); font-family: inherit; font-size: 14px; appearance: none; background-image: url('data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'16\' height=\'16\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'%236b7280\' stroke-width=\'2\' stroke-linecap=\'round\' stroke-linejoin=\'round\'><path d=\'m6 9 6 6 6-6\'/></svg>'); background-repeat: no-repeat; background-position: right 14px center;">
                    <option value="">Select a channel...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="welcomeMessage" style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: var(--text);">Welcome Message</label>
                <textarea id="welcomeMessage" rows="4" class="form-select-styled" oninput="showSaveBar()" style="resize: vertical; padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border); background-color: var(--surface-2); color: var(--text); width: 100%; font-family: inherit; font-size: 14px;" placeholder="Welcome {user} to the server!"></textarea>
                <small style="color: var(--text-muted); display: block; margin-top: 6px; font-size: 12px;">Variables available: {user}, {server}, {memberCount}</small>
            </div>
        </div>

    </main>

    <!-- Save Bar -->
    <div class="save-bar" id="saveBar">
        <span class="save-bar-text">You have unsaved changes.</span>
        <button class="btn btn-primary" onclick="saveSettings()">Save Changes</button>
    </div>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        let originalSettings = {};

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            await loadChannels();
            await loadData();
        });

        async function loadChannels() {
            try {
                const res = await fetch(`/api/server/${guildId}/channels`);
                const data = await res.json();
                const select = document.getElementById('welcomeChannel');
                
                if (data.channels) {
                    data.channels.forEach(ch => {
                        const opt = document.createElement('option');
                        opt.value = ch.id;
                        opt.textContent = '#' + ch.name;
                        select.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('Error loading channels:', err);
            }
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/server/${guildId}/welcome`);
                const data = await res.json();
                if (data.welcome) {
                    originalSettings = data.welcome;
                    document.getElementById('welcomeEnabled').checked = !!data.welcome.enabled;
                    document.getElementById('welcomeChannel').value = data.welcome.channelId || '';
                    document.getElementById('welcomeMessage').value = data.welcome.message || '';
                }
            } catch (err) {
                console.error(err);
            }
        }

        function showSaveBar() {
            document.getElementById('saveBar').classList.add('show');
        }

        function hideSaveBar() {
            document.getElementById('saveBar').classList.remove('show');
        }

        async function saveSettings() {
            const enabled = document.getElementById('welcomeEnabled').checked;
            const channelId = document.getElementById('welcomeChannel').value;
            const message = document.getElementById('welcomeMessage').value;

            try {
                const res = await fetch(`/api/server/${guildId}/welcome`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled, channelId, message })
                });

                if (res.ok) {
                    Swal.fire('Saved!', 'Welcome settings have been updated.', 'success');
                    hideSaveBar();
                } else {
                    throw new Error('Save failed');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Failed to save welcome settings.', 'error');
            }
        }
    </script>
</body>
</html>
