<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Settings — ProMcBot</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .settings-container { max-width: 800px; margin: 0 auto; }
    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text); }
    .form-group input, .form-group select {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); outline: none; transition: 0.3s;
    }
    .form-group input:focus { border-color: #FF512F; }
    .btn-save {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #FF512F 0%, #F09819 100%);
      color: white; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s;
    }
    .btn-save:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(255, 81, 47, 0.3); }
  </style>
</head>
<body class="dark">
  <nav class="navbar">
    <div class="logo_item">
      <i class="bx bx-menu" id="sidebarToggle"></i>
      <img src="/dashboard/logo.png" alt="ProMcBot">
      <span class="brand-name">ProMcBot</span>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight"><i class='bx bx-sun'></i></div>
      <img src="" class="user-avatar" data-user-avatar id="userBtn">
    </div>
  </nav>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="settings-container">
      <div class="section-header">
        <h1>Server Settings</h1>
        <p>Configure your bot's behavior for this specific server.</p>
      </div>

      <div class="settings-card">
        <form id="settingsForm">
          <div class="form-group">
            <label>Bot Prefix</label>
            <input type="text" id="prefix" placeholder="e.g. !" maxlength="5">
          </div>
          <div class="form-group">
            <label>Language</label>
            <select id="language">
              <option value="en">English</option>
              <option value="ar">العربية</option>
            </select>
          </div>
          <div class="form-group">
            <label>Minecraft Server IP</label>
            <input type="text" id="mcIp" placeholder="e.g. play.myserver.com">
          </div>
          <button type="submit" class="btn-save">Save Changes</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/shared.js"></script>
  <script>
    const gId = window.location.pathname.match(/\/servers\/(\d+)/)[1];
    
    document.getElementById('settingsForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {
        prefix: document.getElementById('prefix').value,
        language: document.getElementById('language').value,
        mcIp: document.getElementById('mcIp').value
      };
      
      try {
        const res = await fetch(`/api/guilds/${gId}/settings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        if (res.ok) alert('Settings saved successfully!');
      } catch (e) {
        alert('Failed to save settings.');
      }
    });
  </script>
</body>
</html>
