<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- ProMcBot SEO and social metadata -->
  <meta data-promcbot-metadata="1" name="description" content="Ticket for the ProMcBot Discord and Minecraft management dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://promcbot.dev/dashboard">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ProMcBot">
  <meta property="og:title" content="Ticket — ProMcBot Dashboard">
  <meta property="og:description" content="Ticket for the ProMcBot Discord and Minecraft management dashboard.">
  <meta property="og:url" content="https://promcbot.dev/dashboard">
  <meta property="og:image" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:secure_url" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1983">
  <meta property="og:image:height" content="793">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ticket — ProMcBot Dashboard">
  <meta name="twitter:description" content="Ticket for the ProMcBot Discord and Minecraft management dashboard.">
  <meta name="twitter:image" content="https://promcbot.dev/dashboard/share-preview.png">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/myservers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Tickets</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-support'></i></div>
            <div>
                <h1 class="page-title">Ticket System</h1>
                <p class="page-subtitle">Configure support tickets for your community.</p>
            </div>
        </div>

        <div class="card animated">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-cog'></i></div>
                <div>
                    <h2 class="card-title">General Settings</h2>
                    <p class="card-subtitle">Set up where users can create tickets.</p>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Ticket Channel <span class="required">*</span></label>
                    <select class="form-select-styled" id="channelId" onchange="markUnsaved()">
                        <option value="">Select a channel</option>
                        <!-- Channels injected here -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Enable Tickets</label>
                    <label class="form-check" style="margin-top: 10px;">
                        <div class="toggle">
                            <input type="checkbox" id="enabled" onchange="markUnsaved()">
                            <div class="toggle-slider"></div>
                        </div>
                        <span style="font-size: 13px;">Enable or disable the ticket system</span>
                    </label>
                </div>
            </div>
        </div>

    </main>

    <!-- Save Bar -->
    <div class="save-bar" id="saveBar">
        <span class="save-bar-text">You have unsaved changes.</span>
        <button class="btn btn-primary" onclick="saveSettings()" id="saveBtn"><i class='bx bx-save'></i> Save Changes</button>
    </div>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];
        let hasUnsavedChanges = false;

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            await loadChannels();
            await loadConfig();
        });

        async function loadChannels() {
            try {
                const res = await fetch(`/api/server/${guildId}/channels`);
                const data = await res.json();
                const select = document.getElementById('channelId');
                
                let channels = [];
                if (data.success && data.channels) {
                    channels = data.channels;
                } else if (Array.isArray(data)) {
                    channels = data;
                }

                channels.forEach(ch => {
                    if (ch.type === 0 || ch.type === 'GUILD_TEXT') { // Text channels
                        const option = document.createElement('option');
                        option.value = ch.id;
                        option.textContent = `#${ch.name}`;
                        select.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('Failed to load channels', error);
            }
        }

        async function loadConfig() {
            try {
                        const res = await fetch(`/api/server/${guildId}/ticket-config`);
                const data = await res.json();
                
                let ticketConfig = {};
                if (data.success && data.ticket) {
                    ticketConfig = data.ticket;
                } else if (data.ticket) {
                    ticketConfig = data.ticket;
                }
                
                if (ticketConfig) {
                    if (ticketConfig.channelId) document.getElementById('channelId').value = ticketConfig.channelId;
                    if (ticketConfig.enabled !== undefined) document.getElementById('enabled').checked = ticketConfig.enabled;
                }
                
                // reset save bar if any changes fired during load
                document.getElementById('saveBar').classList.remove('visible');
                hasUnsavedChanges = false;
            } catch (error) {
                console.error('Failed to load config', error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load ticket configuration.' });
            }
        }

        function markUnsaved() {
            if (!hasUnsavedChanges) {
                hasUnsavedChanges = true;
                document.getElementById('saveBar').classList.add('visible');
            }
        }

        async function saveSettings() {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Saving...`;
            btn.disabled = true;

            const channelId = document.getElementById('channelId').value;
            const enabled = document.getElementById('enabled').checked;

            try {
                const res = await fetch(`/api/server/${guildId}/ticket-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channelId, enabled })
                });

                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Saved!', text: 'Ticket settings updated successfully.', timer: 1500, showConfirmButton: false });
                    document.getElementById('saveBar').classList.remove('visible');
                    hasUnsavedChanges = false;
                } else {
                    const data = await res.json();
                    Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to save settings' });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Network error occurred' });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
