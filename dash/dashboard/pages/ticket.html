<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=13">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
  <!-- NAVBAR -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> Notifications</div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> My Profile</a>
          <a href="/my-servers"><i class='bx bx-server'></i> My Servers</a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers" data-i18n="not.servers"><a> <span class="sep">/</span> <span id="breadServerName" data-i18n="pg.loading"><span> <span class="sep">/</span> <span data-i18n="nav.tickets"><span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-support'></i></div>
            <div>
                <h1 class="page-title">Ticket System</h1>
                <p class="page-subtitle">Configure support tickets for your community.</p>
            </div>
        </div>

        <div class="card animated">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-cog'></i></div>
                <div>
                    <h2 class="card-title" data-i18n="pg.general_settings"><h2>
                    <p class="card-subtitle">Set up where users can create tickets.</p>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label">Ticket Channel <span class="required">*</span></label>
                    <select class="form-select-styled" id="channelId" onchange="markUnsaved()">
                        <option value="" data-i18n="pg.select_channel"><option>
                        <!-- Channels injected here -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Enable Tickets</label>
                    <label class="form-check" style="margin-top: 10px;">
                        <div class="toggle">
                            <input type="checkbox" id="enabled" onchange="markUnsaved()">
                            <div class="toggle-slider"></div>
                        </div>
                        <span style="font-size: 13px;">Enable or disable the ticket system</span>
                    </label>
                </div>
            </div>
        </div>

    </main>

    <!-- Save Bar -->
    <div class="save-bar" id="saveBar">
        <span class="save-bar-text" data-i18n="pg.unsaved"><span>
        <button class="btn btn-primary" onclick="saveSettings()" id="saveBtn"><i class='bx bx-save'></i> Save Changes</button>
    </div>

    <script src="/i18n.js?v=12"></script>
  <script src="/shared.js?v=13"></script>
    <script>
        const guildId = window.getGuildIdFromPath() || (window.location.pathname.match(/\/my-servers\/(\d+)/) || [])[1] || '';
        if (!guildId) {
          Swal.fire('Error', 'Server ID not found in the URL. Please go back to My Servers and open this server again.', 'error');
          throw new Error('Page guard triggered: missing context.');
        }
        let hasUnsavedChanges = false;

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            await loadChannels();
            await loadConfig();
        });

        async function loadChannels() {
            try {
                const res = await fetch(`/api/server/${guildId}/channels`);
                const data = await res.json();
                const select = document.getElementById('channelId');
                
                let channels = [];
                if (data.success && data.channels) {
                    channels = data.channels;
                } else if (Array.isArray(data)) {
                    channels = data;
                }

                channels.forEach(ch => {
                    if (ch.type === 0 || ch.type === 'GUILD_TEXT') { // Text channels
                        const option = document.createElement('option');
                        option.value = ch.id;
                        option.textContent = `#${ch.name}`;
                        select.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('Failed to load channels', error);
            }
        }

        async function loadConfig() {
            try {
                        const res = await fetch(`/api/server/${guildId}/ticket-config`);
                const data = await res.json();
                
                let ticketConfig = {};
                if (data.success && data.ticket) {
                    ticketConfig = data.ticket;
                } else if (data.ticket) {
                    ticketConfig = data.ticket;
                }
                
                if (ticketConfig) {
                    if (ticketConfig.channelId) document.getElementById('channelId').value = ticketConfig.channelId;
                    if (ticketConfig.enabled !== undefined) document.getElementById('enabled').checked = ticketConfig.enabled;
                }
                
                // reset save bar if any changes fired during load
                document.getElementById('saveBar').classList.remove('visible');
                hasUnsavedChanges = false;
            } catch (error) {
                console.error('Failed to load config', error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Failed to load ticket configuration.' });
            }
        }

        function markUnsaved() {
            if (!hasUnsavedChanges) {
                hasUnsavedChanges = true;
                document.getElementById('saveBar').classList.add('visible');
            }
        }

        async function saveSettings() {
            const btn = document.getElementById('saveBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class='bx bx-loader-alt bx-spin'></i> Saving...`;
            btn.disabled = true;

            const channelId = document.getElementById('channelId').value;
            const enabled = document.getElementById('enabled').checked;

            try {
                const res = await fetch(`/api/server/${guildId}/ticket-config`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ channelId, enabled })
                });

                if (res.ok) {
                    Swal.fire({ icon: 'success', title: 'Saved!', text: 'Ticket settings updated successfully.', timer: 1500, showConfirmButton: false });
                    document.getElementById('saveBar').classList.remove('visible');
                    hasUnsavedChanges = false;
                } else {
                    const data = await res.json();
                    Swal.fire({ icon: 'error', title: 'Error', text: data.error || 'Failed to save settings' });
                }
            } catch (error) {
                console.error(error);
                Swal.fire({ icon: 'error', title: 'Error', text: 'Network error occurred' });
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
