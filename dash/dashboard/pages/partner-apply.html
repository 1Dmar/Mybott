<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apply · ProMcBot Partners</title><link rel="stylesheet" href="/dashboard/style.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"></head><body><nav class="navbar"><div class="logo_item"><i class="bx bx-menu" id="sidebarToggle"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div></nav><nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span></div><div class="menu_container"><div class="menu_content"></div></div></nav><main class="dashboard-main"><section class="card form-card"><p class="eyebrow">PARTNER APPLICATION</p><h1>Tell us about your community</h1><p>Applications are reviewed by the ProMcBot team. Your authenticated Discord identity is used for the applicant account.</p><form id="partnerForm"><label>Discord User ID<input name="discordUserId" required pattern="[0-9]{5,25}"></label><label>Discord Username<input name="discordUsername" required maxlength="120"></label><label>Community/server name<input name="communityName" required maxlength="160"></label><label>Website or Discord invite<input name="websiteOrInvite" type="url" required maxlength="500"></label><label>Community size<input name="communitySize" type="number" min="1" required></label><label>Community description<textarea name="description" required maxlength="3000"></textarea></label><label>Why do you want to partner?<textarea name="whyPartner" required maxlength="3000"></textarea></label><label>What can you offer ProMcBot?<textarea name="offer" required maxlength="3000"></textarea></label><label>Additional information<textarea name="additionalInformation" maxlength="3000"></textarea></label><button class="button primary" type="submit">Submit application</button><p id="message"></p></form></section></main><script src="/shared.js"></script><script>(async()=>{const f=document.querySelector('#partnerForm'),m=document.querySelector('#message');try{const r=await fetch('/api/partners/me');const d=await r.json();if(d.user){f.discordUserId.value=d.user.id||'';f.discordUsername.value=d.user.username||d.user.global_name||'';f.discordUserId.readOnly=true;f.discordUsername.readOnly=true}}catch(e){}f.onsubmit=async e=>{e.preventDefault();const body=Object.fromEntries(new FormData(f));const r=await fetch('/api/partners/applications',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();m.textContent=d.message||d.error||(r.ok?'Application submitted.':'Unable to submit application.');if(r.ok)f.reset()}})();</script></body></html>
