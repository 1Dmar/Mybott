<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Roles - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .role-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }
        .role-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .role-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }
        .role-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .role-id {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .role-info {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/myservers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Roles</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-shield-quarter'></i></div>
            <div>
                <h1 class="page-title">Server Roles</h1>
                <p class="page-subtitle">View all roles available in this server.</p>
            </div>
        </div>

        <div class="card animated">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-list-ol'></i></div>
                <div>
                    <h2 class="card-title">Role List</h2>
                    <p class="card-subtitle">These are the roles fetched directly from Discord. Currently read-only.</p>
                </div>
            </div>
            
            <div class="grid-auto" id="rolesGrid">
                <!-- Skeletons -->
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
            </div>
        </div>

    </main>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadRoles();
        });

        async function loadRoles() {
            try {
                const res = await fetch(`/api/server/${guildId}/roles`);
                const data = await res.json();
                const container = document.getElementById('rolesGrid');
                container.innerHTML = '';

                let roles = [];
                if (data.success && data.roles) {
                    roles = data.roles;
                } else if (Array.isArray(data)) {
                    roles = data;
                }

                if (roles.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1;">
                            <div class="alert alert-info"><i class='bx bx-info-circle'></i> No roles found.</div>
                        </div>
                    `;
                    return;
                }

                // Sort roles by position descending (usually highest role first)
                roles.sort((a, b) => (b.position || 0) - (a.position || 0));

                roles.forEach(role => {
                    const card = document.createElement('div');
                    card.className = 'role-card';
                    
                    const color = role.hexColor && role.hexColor !== '#000000' ? role.hexColor : 'var(--border)';
                    
                    card.innerHTML = `
                        <div class="role-color" style="background-color: ${color}; ${color === 'var(--border)' ? 'border: 2px solid var(--text-muted); background: transparent;' : 'border-color: transparent;'}"></div>
                        <div class="role-info">
                            <div class="role-name">${role.name}</div>
                            <div class="role-id">${role.id}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('rolesGrid').innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="alert alert-danger"><i class='bx bx-error-circle'></i> Failed to load roles.</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
