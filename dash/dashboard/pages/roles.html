<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Roles - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=20">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .role-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: var(--transition-fast);
        }
        .role-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        .role-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 2px solid var(--border);
        }
        .role-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .role-id {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }
        .role-info {
            flex: 1;
            min-width: 0;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
  <!-- NAVBAR -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> Notifications</div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> My Profile</a>
          <a href="/my-servers"><i class='bx bx-server'></i> My Servers</a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers" data-i18n="not.servers"><a> <span class="sep">/</span> <span id="breadServerName" data-i18n="pg.loading"><span> <span class="sep">/</span> <span data-i18n="nav.roles"><span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-shield-quarter'></i></div>
            <div>
                <h1 class="page-title">Server Roles</h1>
                <p class="page-subtitle">View all roles available in this server.</p>
            </div>
        </div>

        <div class="card animated">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-list-ol'></i></div>
                <div>
                    <h2 class="card-title">Role List</h2>
                    <p class="card-subtitle">These are the roles fetched directly from Discord. Currently read-only.</p>
                </div>
            </div>
            
            <div class="grid-auto" id="rolesGrid">
                <!-- Skeletons -->
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
                <div class="skeleton" style="height: 60px; border-radius: 6px;"></div>
            </div>
        </div>

    </main>

    <script src="/i18n.js?v=20"></script>
  <script src="/shared.js?v=20"></script>
    <script>
        const guildId = window.getGuildIdFromPath() || (window.location.pathname.match(/\/my-servers\/(\d+)/) || [])[1] || '';
        if (!guildId) {
          Swal.fire('Error', 'Server ID not found in the URL. Please go back to My Servers and open this server again.', 'error');
          throw new Error('Page guard triggered: missing context.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadRoles();
        });

        async function loadRoles() {
            try {
                const res = await fetch(`/api/server/${guildId}/roles`);
                const data = await res.json();
                const container = document.getElementById('rolesGrid');
                container.innerHTML = '';

                let roles = [];
                if (data.success && data.roles) {
                    roles = data.roles;
                } else if (Array.isArray(data)) {
                    roles = data;
                }

                if (roles.length === 0) {
                    container.innerHTML = `
                        <div style="grid-column: 1 / -1;">
                            <div class="alert alert-info"><i class='bx bx-info-circle'></i> No roles found.</div>
                        </div>
                    `;
                    throw new Error('Page guard triggered: missing context.');
                }

                // Sort roles by position descending (usually highest role first)
                roles.sort((a, b) => (b.position || 0) - (a.position || 0));

                roles.forEach(role => {
                    const card = document.createElement('div');
                    card.className = 'role-card';
                    
                    const color = role.hexColor && role.hexColor !== '#000000' ? role.hexColor : 'var(--border)';
                    
                    card.innerHTML = `
                        <div class="role-color" style="background-color: ${color}; ${color === 'var(--border)' ? 'border: 2px solid var(--text-muted); background: transparent;' : 'border-color: transparent;'}"></div>
                        <div class="role-info">
                            <div class="role-name">${role.name}</div>
                            <div class="role-id">${role.id}</div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('rolesGrid').innerHTML = `
                    <div style="grid-column: 1 / -1;">
                        <div class="alert alert-danger"><i class='bx bx-error-circle'></i> Failed to load roles.</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
