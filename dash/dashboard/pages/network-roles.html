<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Network roles · ProMcBot</title><link rel="stylesheet" href="/shared.css"><link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"><style>.roles-page{max-width:1040px}.hero,.panel{padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--surface);box-shadow:var(--shadow-sm)}.hero h1{margin:0 0 7px}.hero p,.hint{margin:0;color:var(--text-muted);font-size:12px;line-height:1.55}.form{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:9px;align-items:end;margin-top:16px}.field{color:var(--text-muted);font-size:11px;font-weight:750}.field input,.field select{display:block;width:100%;margin-top:6px}.button{min-height:40px;padding:9px 13px;border:0;border-radius:10px;background:var(--primary);color:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.list{display:grid;gap:9px;margin-top:16px}.role{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}.role strong,.role small{display:block}.role small{margin-top:4px;color:var(--text-muted);font-size:10px}.remove{border:1px solid var(--danger);border-radius:8px;background:transparent;color:var(--danger);padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}.state{margin:16px 0 0;color:var(--text-muted);font-size:12px}.error{color:var(--danger)}@media(max-width:800px){.form{grid-template-columns:1fr 1fr}.form .button{width:100%}}@media(max-width:520px){.form{grid-template-columns:1fr}.role{align-items:flex-start;flex-direction:column}.remove{width:100%}}</style></head>
<body class="dark"><nav class="navbar"><div class="logo_item"><i class="bx bx-menu" id="sidebarToggle" aria-label="Open navigation"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div><div class="navbar_content"><div id="darkLight" role="button" tabindex="0" aria-label="Toggle theme"><i class="bx bx-sun"></i></div><div class="user_profile_nav" id="userBtn"><img src="" alt="Account" data-user-avatar><span data-user-name>User</span></div></div></nav><nav class="sidebar close" id="sidebar"><nav class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span></nav><div class="menu_container"><div class="menu_content"></div></div></nav><main class="main-content"><section class="roles-page"><section class="hero"><div class="eyebrow">Network operations</div><h1>Roles and permissions</h1><p>Assign a bounded Network role to a Discord user. Only the Discord server owner can change these assignments; each record remains scoped to this server and optional Instance IDs.</p><p class="hint" id="state">Loading roles…</p></section><section class="panel" style="margin-top:16px"><form id="form" class="form"><label class="field">Discord user ID<input id="userId" pattern="[0-9]{5,25}" maxlength="25" required placeholder="123456789012345678"></label><label class="field">Role<select id="role"><option value="network_admin">Network Admin</option><option value="server_manager">Server Manager</option><option value="moderator">Moderator</option><option value="viewer">Viewer</option></select></label><label class="field">Server IDs<input id="serverIds" maxlength="2000" placeholder="id1, id2 (optional)"></label><button class="button" type="submit">Save role</button></form><div id="list" class="list"><p class="state">Loading…</p></div></section></section></main><script src="/shared.js"></script><script>(()=>{const id=(location.pathname.match(/\/myservers\/([^/]+)/)||[])[1];const $=x=>document.getElementById(x);const esc=v=>{const n=document.createElement('span');n.textContent=String(v??'');return n.innerHTML};const api=async(url,opt)=>{const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||'Request failed');return d};const url=()=>`/api/guilds/${encodeURIComponent(id)}/network-roles`;function render(roles){$('list').innerHTML=roles.length?roles.map(x=>`<article class="role"><div><strong>${esc(x.userId)} · ${esc(x.role)}</strong><small>${x.serverIds?.length?`Scoped to ${x.serverIds.length} server ID(s)`: 'All connected instances in this Discord server'}</small></div><button class="remove" data-user="${esc(x.userId)}">Remove</button></article>`).join(''):'<p class="state">No Network roles have been assigned.</p>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api(url()+'/'+encodeURIComponent(b.dataset.user),{method:'DELETE'});await load()}catch(e){$('state').textContent=e.message;b.disabled=false}})}async function load(){try{const d=await api(url());render(d.roles||[]);$('state').textContent='Only the Discord server owner can manage these roles.'}catch(e){$('list').innerHTML=`<p class="state error">${esc(e.message)}</p>`;$('state').textContent='Roles are unavailable.'}}$('form').onsubmit=async e=>{e.preventDefault();try{await api(url()+'/'+encodeURIComponent($('userId').value.trim()),{method:'PUT',body:JSON.stringify({role:$('role').value,serverIds:$('serverIds').value.split(',').map(x=>x.trim()).filter(Boolean)})});$('userId').value='';$('serverIds').value='';await load()}catch(e){$('state').textContent=e.message}};if(id)load();else $('state').textContent='No managed server selected.'})();</script></body></html>
