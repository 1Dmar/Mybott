<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Servers — ProMcBot</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .server-picker { max-width: 1180px; }
    .picker-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .picker-hero h1 { margin: 0 0 8px; }
    .picker-hero p { max-width: 560px; margin: 0; color: var(--text-muted); }
    .picker-count { flex: 0 0 auto; min-width: 128px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; box-shadow: var(--shadow-md); }
    .picker-count strong { display: block; font-size: 30px; line-height: 1; }
    .picker-count span { display: block; margin-top: 5px; opacity: .84; font-size: 12px; }
    .picker-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .search-box { position: relative; flex: 1; }
    .search-box i { position: absolute; top: 50%; left: 14px; color: var(--text-muted); transform: translateY(-50%); }
    .search-box input { padding-left: 42px; }
    .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
    .server-card { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-sm); transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), border-color 180ms ease; }
    .server-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .server-card-top { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 18px 18px 14px; }
    .server-icon { display: block; flex: 0 0 52px; width: 52px; height: 52px; border-radius: 15px; object-fit: cover; background: var(--primary-soft); }
    .server-name { min-width: 0; }
    .server-name strong, .server-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .server-name strong { color: var(--text); font-size: 16px; }
    .server-name span { margin-top: 3px; color: var(--text-muted); font-size: 11px; }
    .permission-badge { display: inline-flex; align-items: center; gap: 5px; width: fit-content; margin: 0 18px 15px; padding: 5px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 750; }
    .server-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding: 13px 18px; border-top: 1px solid var(--border); }
    .server-card-footer small { color: var(--text-muted); }
    .server-open { display: inline-flex; align-items: center; gap: 5px; color: var(--primary); font-size: 13px; font-weight: 750; text-decoration: none; }
    .server-open:hover { color: var(--primary-strong); }
    .empty-state { grid-column: 1 / -1; padding: 36px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 18px; color: var(--text-muted); }
    .empty-state i { display: block; margin-bottom: 8px; color: var(--primary); font-size: 34px; }
    @media (max-width: 640px) { .picker-hero { display: block; } .picker-count { display: inline-block; min-width: 116px; margin-top: 16px; } .picker-toolbar { display: block; } .picker-toolbar > * + * { margin-top: 10px; } }
  </style>
</head>
<body class="dark">
  <nav class="navbar">
    <div class="logo_item"><i class="bx bx-menu" id="sidebarToggle" aria-label="Open navigation"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div>
    <div class="navbar_content"><div class="nav-icon-btn" id="darkLight" role="button" tabindex="0" aria-label="Toggle theme"><i class="bx bx-sun"></i></div><img src="" class="user-avatar" data-user-avatar id="userBtn" alt="Account"></div>
  </nav>
  <nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span><i class="bx bx-x" id="sidebar-close" aria-label="Close navigation"></i></div><div class="menu_container"><div class="menu_content"></div><div class="sidebar-footer"><div class="sidebar_profile flex"><span class="nav_image"><img src="" alt="Account" data-user-avatar></span><div class="data_text"><span class="name" data-user-name>User</span><span class="email" data-user-id>ID</span></div></div></div></div></nav>
  <main class="main-content">
    <section class="server-picker" aria-labelledby="pageTitle">
      <div class="picker-hero">
        <div><div class="eyebrow">Workspace</div><h1 id="pageTitle">My servers</h1><p>Only servers you can manage are shown here. Pick one to open its setup and live health workspace.</p></div>
        <div class="picker-count"><strong id="serverCount">—</strong><span>managed servers</span></div>
      </div>
      <div class="picker-toolbar"><label class="search-box" for="serverSearch"><i class="bx bx-search" aria-hidden="true"></i><input id="serverSearch" type="search" placeholder="Search managed servers" autocomplete="off"></label></div>
      <div class="server-grid" id="serversGrid"><div class="loading-state">Loading managed servers…</div></div>
    </section>
  </main>
  <script src="/shared.js"></script>
  <script>
    (() => {
      const grid = document.getElementById('serversGrid');
      const search = document.getElementById('serverSearch');
      const count = document.getElementById('serverCount');
      let servers = [];
      const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      const label = permission => ({ owner: 'Owner', administrator: 'Administrator', manage_guild: 'Manage Server' }[permission] || 'Manage Server');
      const iconFor = guild => guild.icon ? `https://cdn.discordapp.com/icons/${encodeURIComponent(guild.id)}/${guild.icon}.png` : '/dashboard/logo.png';
      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = servers.filter(guild => !query || String(guild.name || '').toLowerCase().includes(query));
        count.textContent = servers.length;
        if (!visible.length) { grid.innerHTML = `<div class="empty-state"><i class="bx bx-server"></i><strong>${servers.length ? 'No matching server' : 'No managed servers yet'}</strong><div>${servers.length ? 'Try another name.' : 'Ask a server owner to grant you Manage Server or Administrator permission.'}</div></div>`; return; }
        grid.innerHTML = visible.map(guild => `<article class="server-card"><div class="server-card-top"><img class="server-icon" src="${iconFor(guild)}" alt=""><div class="server-name"><strong>${esc(guild.name || 'Unnamed server')}</strong><span>Discord server · ${esc(guild.id)}</span></div></div><span class="permission-badge"><i class="bx bx-shield-quarter"></i>${label(guild.managePermission)}</span><div class="server-card-footer"><small>Server workspace</small><a class="server-open" href="/myservers/${encodeURIComponent(guild.id)}/overview">Open <i class="bx bx-right-arrow-alt"></i></a></div></article>`).join('');
      }
      async function loadServers() {
        try {
          const response = await fetch('/api/guilds', { headers: { Accept: 'application/json' } });
          if (!response.ok) throw new Error('managed_servers_unavailable');
          const data = await response.json();
          servers = Array.isArray(data.guilds) ? data.guilds : [];
          render();
        } catch (_) {
          grid.innerHTML = '<div class="empty-state"><i class="bx bx-error-circle"></i><strong>Managed servers could not load</strong><div>Refresh the page or sign in again.</div></div>';
        }
      }
      search.addEventListener('input', render);
      document.addEventListener('DOMContentLoaded', loadServers);
    })();
  </script>
</body>
</html>
