<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Servers — ProMcBot</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .server-picker { max-width: 1180px; }
    .picker-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .picker-hero h1 { margin: 0 0 8px; }
    .picker-hero p { max-width: 560px; margin: 0; color: var(--text-muted); }
    .picker-count { flex: 0 0 auto; min-width: 128px; padding: 16px 18px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; box-shadow: var(--shadow-md); }
    .picker-count strong { display: block; font-size: 30px; line-height: 1; }
    .picker-count span { display: block; margin-top: 5px; opacity: .84; font-size: 12px; }
    .picker-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .search-box { position: relative; flex: 1; }
    .search-box i { position: absolute; top: 50%; left: 14px; color: var(--text-muted); transform: translateY(-50%); }
    .search-box input { padding-left: 42px; }
    .server-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 16px; }
    .server-card { position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-sm); transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), border-color 180ms ease; }
    .server-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .server-banner { position: relative; min-height: 116px; overflow: hidden; padding: 16px 18px; background: var(--server-color, var(--primary)); }
    .server-banner::before { position: absolute; inset: 0; content: ''; background-image: var(--server-banner, none); background-position: center; background-size: cover; opacity: .78; }
    .server-banner::after { position: absolute; inset: 0; content: ''; background: linear-gradient(90deg, rgba(10, 15, 35, .82), rgba(10, 15, 35, .18)); }
    .server-banner-content { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
    .server-icon { display: block; flex: 0 0 54px; width: 54px; height: 54px; border: 3px solid rgba(255,255,255,.74); border-radius: 16px; object-fit: cover; background: rgba(255,255,255,.18); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    .server-name { min-width: 0; color: #fff; }
    .server-name strong, .server-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .server-name strong { color: #fff; font-size: 16px; }
    .server-name span { margin-top: 3px; color: rgba(255,255,255,.78); font-size: 11px; }
    .permission-badge { display: inline-flex; align-items: center; gap: 5px; width: fit-content; margin: 0 18px 15px; padding: 5px 8px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); font-size: 11px; font-weight: 750; }
    .server-card-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: auto; padding: 13px 18px; border-top: 1px solid var(--border); }
    .server-card-footer small { color: var(--text-muted); }
    .server-open { display: inline-flex; align-items: center; gap: 5px; color: var(--primary); font-size: 13px; font-weight: 750; text-decoration: none; }
    .server-open:hover { color: var(--primary-strong); }
    .server-open.disabled { color: var(--text-muted); cursor: default; }
    .server-access-note { margin: 0 18px 14px; color: var(--text-muted); font-size: 12px; line-height: 1.45; }
    .server-access-note strong { color: var(--warning, #b45309); }
    .empty-state { grid-column: 1 / -1; padding: 36px 20px; text-align: center; background: var(--surface); border: 1px dashed var(--border); border-radius: 18px; color: var(--text-muted); }
    .empty-state i { display: block; margin-bottom: 8px; color: var(--primary); font-size: 34px; }
    @media (max-width: 640px) { .picker-hero { display: block; } .picker-count { display: inline-block; min-width: 116px; margin-top: 16px; } .picker-toolbar { display: block; } .picker-toolbar > * + * { margin-top: 10px; } }
  </style>
  <!-- ProMcBot SEO and social metadata -->
  <meta data-promcbot-metadata="1" name="description" content="Manage your connected Discord and Minecraft servers in ProMcBot.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://promcbot.dev/myservers">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ProMcBot">
  <meta property="og:title" content="My Servers — ProMcBot">
  <meta property="og:description" content="Manage your connected Discord and Minecraft servers in ProMcBot.">
  <meta property="og:url" content="https://promcbot.dev/myservers">
  <meta property="og:image" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:secure_url" content="https://promcbot.dev/dashboard/share-preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1983">
  <meta property="og:image:height" content="793">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="My Servers — ProMcBot">
  <meta name="twitter:description" content="Manage your connected Discord and Minecraft servers in ProMcBot.">
  <meta name="twitter:image" content="https://promcbot.dev/dashboard/share-preview.png">
</head>
<body class="dark">
  <nav class="navbar">
    <div class="logo_item"><i class="bx bx-menu" id="sidebarToggle" aria-label="Open navigation"></i><img src="/dashboard/logo.png" alt="ProMcBot"><span class="brand-name">ProMcBot</span></div>
    <div class="navbar_content"><div class="nav-icon-btn" id="darkLight" role="button" tabindex="0" aria-label="Toggle theme"><i class="bx bx-sun"></i></div><img src="" class="user-avatar" data-user-avatar id="userBtn" alt="Account"></div>
  </nav>
  <nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="ProMcBot"></span><span class="logo_name">ProMcBot</span><i class="bx bx-x" id="sidebar-close" aria-label="Close navigation"></i></div><div class="menu_container"><div class="menu_content"></div><div class="sidebar-footer"><div class="sidebar_profile flex"><span class="nav_image"><img src="" alt="Account" data-user-avatar></span><div class="data_text"><span class="name" data-user-name>User</span><span class="email" data-user-id>ID</span></div></div></div></div></nav>
  <main class="main-content">
    <section class="server-picker" aria-labelledby="pageTitle">
      <div class="picker-hero">
        <div><div class="eyebrow">Workspace</div><h1 id="pageTitle">My servers</h1><p>Only servers you can manage are shown here. Pick one to open its setup and live health workspace.</p></div>
        <div class="picker-count"><strong id="serverCount">—</strong><span>managed servers</span></div>
      </div>
      <div class="picker-toolbar"><label class="search-box" for="serverSearch"><i class="bx bx-search" aria-hidden="true"></i><input id="serverSearch" type="search" placeholder="Search managed servers" autocomplete="off"></label></div>
      <div class="server-grid" id="serversGrid"><div class="loading-state">Loading managed servers…</div></div>
    </section>
  </main>
  <script src="/shared.js"></script>
  <script>
    (() => {
      const grid = document.getElementById('serversGrid');
      const search = document.getElementById('serverSearch');
      const count = document.getElementById('serverCount');
      let servers = []; let visuals = {};
      const esc = value => String(value ?? '').replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[character]));
      const label = permission => ({ owner: 'Owner', administrator: 'Administrator', manage_guild: 'Manage Server', platform_owner: 'Platform access' }[permission] || 'Manage Server');
      const safeDiscordCdn = value => { try { const url = new URL(String(value || '')); return url.protocol === 'https:' && url.hostname === 'cdn.discordapp.com' ? url.href.replace(/[()"']/g, '') : ''; } catch (_) { return ''; } };
      const safeInvite = value => { try { const url = new URL(String(value || '')); const allowedHosts = new Set(['discord.com', 'www.discord.com', 'discordapp.com', 'www.discordapp.com', 'discord.gg']); return url.protocol === 'https:' && allowedHosts.has(url.hostname.toLowerCase()) ? url.href : ''; } catch (_) { return ''; } };
      const iconFor = guild => safeDiscordCdn(visuals[guild.id]?.iconUrl) || (guild.icon ? `https://cdn.discordapp.com/icons/${encodeURIComponent(guild.id)}/${guild.icon}.png` : '/dashboard/logo.png');
      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = servers.filter(guild => !query || String(guild.name || '').toLowerCase().includes(query));
        count.textContent = servers.length;
        if (!visible.length) { grid.innerHTML = `<div class="empty-state"><i class="bx bx-server"></i><strong>${servers.length ? 'No matching server' : 'No managed servers yet'}</strong><div>${servers.length ? 'Try another name.' : 'Ask a server owner to grant you Manage Server or Administrator permission.'}</div></div>`; return; }
        grid.innerHTML = visible.map(guild => { const visual = visuals[guild.id] || {}; const installed = guild.botStatus === 'installed'; const botUnknown = guild.botStatus === 'unknown'; const inviteUrl = safeInvite(guild.inviteUrl); const action = installed ? `<a class="server-open" href="/myservers/${encodeURIComponent(guild.id)}/overview">Open <i class="bx bx-right-arrow-alt"></i></a>` : inviteUrl ? `<a class="server-open" href="${esc(inviteUrl)}" target="_blank" rel="noopener noreferrer">Invite bot <i class="bx bx-link-external"></i></a>` : `<span class="server-open disabled">${botUnknown ? 'Checking bot…' : 'Invite required'}</span>`; const note = installed ? '' : `<div class="server-access-note"><strong>${botUnknown ? 'Bot status is loading.' : 'ProMcBot is not in this server.'}</strong> ${botUnknown ? 'Try again shortly.' : 'Invite it before opening the server workspace.'}</div>`; return `<article class="server-card"><div class="server-banner" data-server-art="${esc(guild.id)}" style="--server-color:${esc(visual.dominantColor || '#5865f2')}"><div class="server-banner-content"><img class="server-icon" src="${esc(iconFor(guild))}" alt=""><div class="server-name"><strong>${esc(guild.name || 'Unnamed server')}</strong><span>Discord server</span></div></div></div><span class="permission-badge"><i class="bx bx-shield-quarter"></i>${label(guild.managePermission)}</span>${note}<div class="server-card-footer"><small>${installed ? 'Server workspace' : 'Bot required'}</small>${action}</div></article>`; }).join(''); grid.querySelectorAll('[data-server-art]').forEach(art => { const visual = visuals[art.dataset.serverArt]; const bannerUrl = safeDiscordCdn(visual?.bannerUrl); if (bannerUrl) art.style.setProperty('--server-banner', `url("${bannerUrl}")`); });
      }
      async function loadServers() {
        try {
          const response = await fetch('/api/guilds', { headers: { Accept: 'application/json' } });
          if (!response.ok) throw new Error('managed_servers_unavailable');
          const data = await response.json();
          servers = Array.isArray(data.guilds) ? data.guilds : [];
          const params = new URLSearchParams(window.location.search);
          if (params.has('bot_not_in_server')) window.showToast('Invite ProMcBot to this server before opening its workspace.');
          if (params.has('bot_membership_unavailable')) window.showToast('Bot membership is still loading. Try again shortly.');
          render();
          await loadVisuals();
        } catch (_) {
          grid.innerHTML = '<div class="empty-state"><i class="bx bx-error-circle"></i><strong>Managed servers could not load</strong><div>Refresh the page or sign in again.</div></div>';
        }
      }
      async function loadVisuals() { const pending = servers.map(async guild => { try { const response = await fetch(`/api/guilds/${encodeURIComponent(guild.id)}/visual`, { credentials: 'same-origin' }); if (!response.ok) return; const data = await response.json(); visuals[guild.id] = data.visual || {}; } catch (_) {} }); await Promise.allSettled(pending); render(); }
      search.addEventListener('input', render);
      document.addEventListener('DOMContentLoaded', loadServers);
    })();
  </script>
</body>
</html>
