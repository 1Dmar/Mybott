<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProMcBot — My Servers</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .servers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }
    .server-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      transition: 0.3s;
      position: relative;
    }
    .server-card:hover { transform: translateY(-5px); border-color: #FF512F; box-shadow: var(--shadow-xl); }
    .server-banner { height: 80px; background: linear-gradient(135deg, #1e1b4b 0%, #311026 100%); }
    .server-icon {
      width: 70px; height: 70px; border-radius: 18px; border: 4px solid var(--surface);
      position: absolute; top: 45px; left: 20px; background: var(--surface-2); object-fit: cover;
    }
    .server-info { padding: 45px 20px 20px; }
    .server-name { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .server-id { font-size: 12px; color: var(--text-muted); font-family: monospace; margin-bottom: 16px; }
    .btn-manage {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; background: linear-gradient(135deg, #FF512F 0%, #F09819 100%);
      color: white; border-radius: 10px; font-weight: 700; text-decoration: none; transition: 0.3s;
    }
    .btn-invite {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 10px; background: var(--surface-2); color: var(--text);
      border-radius: 10px; font-weight: 700; text-decoration: none; border: 1px solid var(--border);
    }
    .badge-bot {
      position: absolute; top: 12px; right: 12px; padding: 4px 10px;
      background: rgba(16, 185, 129, 0.9); color: white; border-radius: 20px;
      font-size: 10px; font-weight: 800; text-transform: uppercase;
    }
  </style>
</head>
<body class="dark">
  <nav class="navbar">
    <div class="logo_item">
      <i class="bx bx-menu" id="sidebarToggle"></i>
      <img src="/dashboard/logo.png" alt="ProMcBot">
      <span class="brand-name">ProMcBot</span>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight"><i class='bx bx-sun'></i></div>
      <img src="" class="user-avatar" data-user-avatar id="userBtn">
    </div>
  </nav>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="section-header">
      <h1>My Servers</h1>
      <p>Select a server to manage its Minecraft integration and Discord settings.</p>
    </div>

    <div class="servers-grid" id="serversGrid">
      <!-- Servers will be loaded here -->
      <div class="loading-state">Loading your servers...</div>
    </div>
  </main>

  <script src="/shared.js"></script>
  <script>
    async function loadServers() {
      try {
        const res = await fetch('/callback/check/userData');
        const data = await res.json();
        if (!data.authenticated) return;

        const grid = document.getElementById('serversGrid');
        grid.innerHTML = '';

        data.user.guilds.forEach(guild => {
          const hasBot = guild.botInGuild; // This depends on your backend logic
          const icon = guild.icon 
            ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`
            : `https://cdn.discordapp.com/embed/avatars/0.png`;
          
          const card = document.createElement('div');
          card.className = 'server-card';
          card.innerHTML = `
            <div class="server-banner"></div>
            <img src="${icon}" class="server-icon" alt="${guild.name}">
            ${hasBot ? '<span class="badge-bot">Connected</span>' : ''}
            <div class="server-info">
              <div class="server-name">${guild.name}</div>
              <div class="server-id">ID: ${guild.id}</div>
              ${hasBot 
                ? `<a href="/servers/${guild.id}/overview" class="btn-manage"><i class="bx bx-cog"></i> Manage</a>`
                : `<a href="/invitebot" class="btn-invite"><i class="bx bx-plus"></i> Add Bot</a>`
              }
            </div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        console.error("Failed to load servers", e);
      }
    }
    
    document.addEventListener('DOMContentLoaded', loadServers);
  </script>
</body>
</html>
