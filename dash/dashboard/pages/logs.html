<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Logs</span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-list-ul'></i></div>
            <div>
                <h1 class="page-title">Audit Logs</h1>
                <p class="page-subtitle">Recent administrative actions performed by the bot or users.</p>
            </div>
        </div>

        <div class="card animated">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-history'></i></div>
                <div>
                    <h2 class="card-title">Recent Activity</h2>
                    <p class="card-subtitle">Showing the most recent actions logged on this server.</p>
                </div>
            </div>

            <div class="timeline" id="logsContainer">
                <div class="skeleton" style="height: 100px; margin-bottom: 20px;"></div>
                <div class="skeleton" style="height: 100px; margin-bottom: 20px;"></div>
                <div class="skeleton" style="height: 100px;"></div>
            </div>
        </div>
    </main>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadLogs();
        });

        async function loadLogs() {
            try {
                const res = await fetch(`/api/server/${guildId}/logs`);
                const data = await res.json();
                const container = document.getElementById('logsContainer');

                if (!res.ok || !data.success) {
                    container.innerHTML = `<div class="alert alert-danger"><i class='bx bx-error-circle'></i> Error loading logs: ${data.error || 'Unknown error'}</div>`;
                    return;
                }

                if (!data.logs || data.logs.length === 0) {
                    container.innerHTML = `<div class="alert alert-info"><i class='bx bx-info-circle'></i> No logs found for this server.</div>`;
                    return;
                }

                container.innerHTML = '';
                
                data.logs.forEach(log => {
                    const date = new Date(log.createdAt);
                    const timeString = date.toLocaleString();
                    
                    let dotClass = 'info';
                    if (log.action.toLowerCase().includes('delete') || log.action.toLowerCase().includes('remove') || log.action.toLowerCase().includes('ban')) {
                        dotClass = 'error';
                    } else if (log.action.toLowerCase().includes('create') || log.action.toLowerCase().includes('add') || log.action.toLowerCase().includes('unban')) {
                        dotClass = 'success';
                    } else if (log.action.toLowerCase().includes('warn') || log.action.toLowerCase().includes('update')) {
                        dotClass = 'warn';
                    }

                    const item = document.createElement('div');
                    item.className = 'timeline-item';
                    item.innerHTML = `
                        <div class="timeline-dot ${dotClass}"></div>
                        <div class="timeline-card">
                            <div class="timeline-meta">
                                <span class="timeline-type">${log.action}</span>
                                <span class="timeline-time">${timeString}</span>
                            </div>
                            <div class="timeline-content">
                                <span class="timeline-user">${log.user}</span>: ${log.reason || 'No reason provided'}
                            </div>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('logsContainer').innerHTML = `<div class="alert alert-danger"><i class='bx bx-error-circle'></i> Failed to load logs.</div>`;
            }
        }
    </script>
</body>
</html>
