 <section class="main-content">
        <style>
        .log-cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    gap: 20px;
}

        .main-content {
    padding: 20px;
    margin-left: 260px;
    transition: margin-left 0.5s ease;
    border: 1px solid;
}

h4 {
    color: var(--text);
}

.card {
    margin-top: 13px;
    height: 250px;
    background: var(--bg);
    margin-bottom: 20px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    text-align: center;
    position: relative;
    overflow: hidden;
    border-radius: 10px;
}

.card img {
    max-width: 50px;
    height: auto;
    border-radius: 30%;
    filter: drop-shadow(1px 1px 33px black);
    position: absolute;
    top: 10px;
    left: 10px;
}

.card-banner {
    background-color: rgba(0, 0, 0, 0.5);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;
    filter: blur(5px);
}

.card.premium .card-banner {
    background: linear-gradient(135deg, #ffd700, #ffb700);
}

.card.premium {
    border: 2px solid gold;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
}

.card-content {
    position: absolute;
    top: 60%;
    left: 10px;
    right: 10px;
}

.card h4 {
    margin: 0;
    font-size: 16px;
    color: var(--grey-color-light);
}

.btn-view-logs {
    display: inline-block;
    margin-top: 10px;
    padding: 5px 10px;
    background-color: rgba(255, 255, 255, 0.8);
    color: #007bff;
    text-decoration: none;
    border-radius: 5px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.5);
}

.modal-content {
    background-color: #fefefe;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
    border-radius: 10px;
}

.close-btn {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
}

.close-btn:hover,
.close-btn:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
}

        </style>
      <div class="log-list">
      <div class="log-grid">
                  <h2>Your Server Logs</h2>
        <h2>Your Server Logs</h2>

        <h2>Your Server Logs</h2>
        <div class="log-cards" id="server-logs"></div>
      </div>
    </div>
    <div id="manage-modal" class="modal">
      <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Manage Log Type</h2>
        <form id="manage-form">
          <label for="log-type">Log Type</label>
          <input type="text" id="log-type" name="logType" readonly>
          <label for="log-channel-id">Log Channel ID</label>
          <input type="text" id="log-channel-id" name="logChannelId" required>
          <label for="embed-color">Embed Color</label>
          <input type="text" id="embed-color" name="embedColor" required>
          <input type="hidden" id="server-id" name="serverId">
          <button type="submit">Save Changes</button>
        </form>
      </div>
    </div>
  </section>
  <script>
       async function fetchLogData() {
      const serverId = `${serverId}`; // استبدل هذا بالقيمة الحقيقية
      try {
        console.log('Fetching logs...'); // إضافة رسالة سجل
        const response = await fetch(`/server/${serverId}/logs`);
        const data = await response.json();
        console.log('Data received:', data); // إضافة رسالة سجل

        const logCardsContainer = document.querySelector('.log-cards');
        logCardsContainer.innerHTML = ''; // مسح البطاقات الحالية

        data.forEach(log => {
          const card = createLogCard(log.logType, log);
          logCardsContainer.appendChild(card);
        });

        if (data.length === 0) {
          console.log('No logs found for the server.'); // رسالة في حال عدم وجود بيانات
          logCardsContainer.innerHTML = '<p>No logs found for the server.</p>';
        }
      } catch (error) {
        console.error('Error fetching logs:', error); // إضافة رسالة سجل
        document.querySelector('.log-cards').innerHTML = '<p>Error fetching logs.</p>';
      }
    }

    function createLogCard(logType, log) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-banner" style="background-color: ${log.embedColor}; filter: blur(5px);"></div>
        <img src="server-icon.png" alt="${logType}">
        <div class="card-content">
          <h4>${logType}</h4>
          <button class="btn-setup" data-log-type="${logType}" data-log-channel-id="${log.logChannelId}" data-embed-color="${log.embedColor}">Setup</button>
          <button class="btn-manage" data-log-type="${logType}" data-log-channel-id="${log.logChannelId}" data-embed-color="${log.embedColor}">Manage</button>
        </div>
      `;
      return card;
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetchLogData();

      const modal = document.getElementById('manage-modal');
      const closeModalBtn = document.querySelector('.close-btn');
      const manageForm = document.getElementById('manage-form');

      document.addEventListener('click', (event) => {
        if (event.target.classList.contains('btn-manage') || event.target.classList.contains('btn-setup')) {
          const logType = event.target.getAttribute('data-log-type');
          const logChannelId = event.target.getAttribute('data-log-channel-id');
          const embedColor = event.target.getAttribute('data-embed-color');
          const serverId = 'server-id-placeholder'; // استبدل هذا بالقيمة الحقيقية

          document.getElementById('log-type').value = logType;
          document.getElementById('log-channel-id').value = logChannelId;
          document.getElementById('embed-color').value = embedColor;
          document.getElementById('server-id').value = serverId;

          modal.style.display = 'block';
        }
      });

      closeModalBtn.addEventListener('click', () => {
        modal.style.display = 'none';
      });

      manageForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const logType = document.getElementById('log-type').value;
        const logChannelId = document.getElementById('log-channel-id').value;
        const embedColor = document.getElementById('embed-color').value;
        const serverId = document.getElementById('server-id').value;

        try {
          const response = await fetch(`/logs/${serverId}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ logType, logChannelId, embedColor })
          });

          const result = await response.json();
          alert(result.message);

          modal.style.display = 'none';
          fetchLogData();
        } catch (error) {
          console.error('Error updating logs:', error); // إضافة رسالة سجل
        }
      });

      window.onclick = (event) => {
        if (event.target == modal) {
          modal.style.display = 'none';
        }
      };
    });
  </script>
    <script src="/shared.js"></script>
    
  </body>
</html>
