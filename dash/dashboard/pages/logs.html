<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=8">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
      <!-- ── NAVBAR ── -->
    <!-- ── NAVBAR ── -->
    <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> Notifications</div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> My Profile</a>
          <a href="/my-servers"><i class='bx bx-server'></i> My Servers</a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers" data-i18n="not.servers"><a> <span class="sep">/</span> <span id="breadServerName" data-i18n="pg.loading"><span> <span class="sep">/</span> <span data-i18n="not.logs"><span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-list-ul'></i></div>
            <div>
                <h1 class="page-title">Audit Logs</h1>
                <p class="page-subtitle">Recent administrative actions performed by the bot or users.</p>
            </div>
        </div>

        <div class="card animated">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-history'></i></div>
                <div>
                    <h2 class="card-title" data-i18n="not.recent_activity"><h2>
                    <p class="card-subtitle">Showing the most recent actions logged on this server.</p>
                </div>
            </div>

            <div class="timeline" id="logsContainer">
                <div class="skeleton" style="height: 100px; margin-bottom: 20px;"></div>
                <div class="skeleton" style="height: 100px; margin-bottom: 20px;"></div>
                <div class="skeleton" style="height: 100px;"></div>
            </div>
        </div>
    </main>

    <script src="/i18n.js?v=6"></script>
  <script src="/shared.js?v=6"></script>
    <script>
        const guildId = window.getGuildIdFromPath() || (window.location.pathname.match(/\/my-servers\/(\d+)/) || [])[1] || '';
        if (!guildId) {
          Swal.fire('Error', 'Server ID not found in the URL. Please go back to My Servers and open this server again.', 'error');
          throw new Error('Page guard triggered: missing context.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('breadServerName').textContent = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            loadLogs();
        });

        async function loadLogs() {
            try {
                const res = await fetch(`/api/server/${guildId}/logs`);
                const data = await res.json();
                const container = document.getElementById('logsContainer');

                if (!res.ok || !data.success) {
                    container.innerHTML = `<div class="alert alert-danger"><i class='bx bx-error-circle'></i> Error loading logs: ${data.error || 'Unknown error'}</div>`;
                    throw new Error('Page guard triggered: missing context.');
                }

                if (!data.logs || data.logs.length === 0) {
                    container.innerHTML = `<div class="alert alert-info"><i class='bx bx-info-circle'></i> No logs found for this server.</div>`;
                    throw new Error('Page guard triggered: missing context.');
                }

                container.innerHTML = '';
                
                data.logs.forEach(log => {
                    const date = new Date(log.createdAt);
                    const timeString = date.toLocaleString();
                    
                    let dotClass = 'info';
                    if (log.action.toLowerCase().includes('delete') || log.action.toLowerCase().includes('remove') || log.action.toLowerCase().includes('ban')) {
                        dotClass = 'error';
                    } else if (log.action.toLowerCase().includes('create') || log.action.toLowerCase().includes('add') || log.action.toLowerCase().includes('unban')) {
                        dotClass = 'success';
                    } else if (log.action.toLowerCase().includes('warn') || log.action.toLowerCase().includes('update')) {
                        dotClass = 'warn';
                    }

                    const item = document.createElement('div');
                    item.className = 'timeline-item';
                    item.innerHTML = `
                        <div class="timeline-dot ${dotClass}"></div>
                        <div class="timeline-card">
                            <div class="timeline-meta">
                                <span class="timeline-type">${log.action}</span>
                                <span class="timeline-time">${timeString}</span>
                            </div>
                            <div class="timeline-content">
                                <span class="timeline-user">${log.user}</span>: ${log.reason || 'No reason provided'}
                            </div>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('logsContainer').innerHTML = `<div class="alert alert-danger"><i class='bx bx-error-circle'></i> Failed to load logs.</div>`;
            }
        }
    </script>
</body>
</html>
