<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ProMcBot | Action Center</title><link rel="stylesheet" href="/shared.css"><style>
.wrap{max-width:1100px;margin:auto;padding:2rem}.card{background:var(--surface);border-radius:14px;padding:1.25rem;margin:1rem 0;box-shadow:var(--shadow-md)}.muted{color:var(--text-muted)}.row{display:flex;justify-content:space-between;gap:1rem;align-items:center;padding:.9rem 0;border-bottom:1px solid var(--border)}.row:last-child{border:0}.priority{font-size:.75rem;text-transform:uppercase;font-weight:700}.high{color:#ef4444}.medium{color:#f59e0b}.read{opacity:.6}button{padding:.6rem .9rem;border:0;border-radius:8px;background:var(--primary);color:#fff;cursor:pointer}
</style></head><body>
<nav class="sidebar close" id="sidebar"><div class="logo_items flex"><span class="nav_image"><img src="/dashboard/logo.png" alt="logo"></span><span class="logo_name">ProMcBot</span><i class="bx bx-lock-alt" id="lock-icon"></i><i class="bx bx-x" id="sidebar-close"></i></div><div class="menu_container"><div class="menu_content"></div></div></nav>
<nav class="navbar flex"><i class="bx bx-menu" id="sidebarToggle"></i><div class="navbar_content flex"><i class="bx bx-sun" id="darkLight"></i><span id="navUserName">User</span></div></nav>
<main class="main-content"><div class="wrap"><h1>Action Center</h1><p class="muted">Only evidence-backed issues and delivered system actions appear here. A recommendation is not shown as executable unless a real action is wired behind it.</p><div class="card"><h2>Important issues</h2><div id="issues"><p class="muted">Loading…</p></div></div><div class="card"><h2>Notifications</h2><div id="notifications"><p class="muted">Loading…</p></div></div></div></main>
<script src="/shared.js"></script><script>
const $=id=>document.getElementById(id); async function api(url){const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error||`Request failed (${r.status})`);return d;} function render(guild){Promise.all([api(`/api/guilds/${guild.id}/action-center`)]).then(([data])=>{const issues=$('issues');issues.innerHTML=data.issues.length?data.issues.map(item=>`<div class="row"><div><strong>${item.title}</strong><p class="muted">${item.impact||item.evidence}</p></div><span class="priority medium">${item.executable?'Ready':'Recommendation only'}</span></div>`).join(''):'<p class="muted">No evidence-backed action is required right now.</p>';const notifications=$('notifications');notifications.innerHTML=data.notifications.length?data.notifications.map(item=>`<div class="row ${item.readAt?'read':''}"><div><strong>${item.title}</strong><p class="muted">${item.message}</p><small class="muted">${item.source} · ${new Date(item.createdAt).toLocaleString()}</small></div><button data-id="${item._id}" ${item.readAt?'disabled':''}>${item.readAt?'Read':'Mark read'}</button></div>`).join(''):'<p class="muted">No notifications.</p>';notifications.querySelectorAll('button[data-id]').forEach(btn=>btn.onclick=async()=>{await fetch(`/api/guilds/${guild.id}/notifications/${btn.dataset.id}/read`,{method:'PATCH'});render(guild);});}).catch(e=>{$('issues').textContent=e.message;});} api('/api/guilds').then(data=>{const guild=data.guilds?.[0];if(guild)render(guild);else $('issues').textContent='No accessible servers were returned by Discord.';}).catch(e=>{$('issues').textContent=e.message;});
</script></body></html>
