<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Admin Panel - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=7">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .notif-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; margin-top: 20px; }
        @media (max-width: 1100px) { .notif-grid { grid-template-columns: 1fr; } }

        .notif-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
        .notif-card h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; color: var(--text-color); }
        .notif-card h2 i { color: var(--primary-color); }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 5px; }
        .notif-input, .notif-select, .notif-textarea {
            width: 100%; background: var(--input-bg, #0d1117); color: var(--text-color, #e6edf3);
            border: 1px solid var(--border-color); border-radius: 8px; padding: 9px 12px; font-size: 13px; outline: none;
            transition: border-color 0.2s;
        }
        .notif-input:focus, .notif-select:focus, .notif-textarea:focus { border-color: var(--primary-color); }
        .notif-textarea { resize: vertical; min-height: 90px; font-family: inherit; }
        .notif-select { appearance: auto; }

        .target-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .target-chip {
            padding: 7px 12px; font-size: 12px; font-weight: 600; border-radius: 8px;
            background: var(--input-bg, #0d1117); border: 1px solid var(--border-color); color: var(--text-secondary);
            cursor: pointer; transition: all 0.2s;
        }
        .target-chip.active { background: rgba(0, 123, 255, 0.15); border-color: var(--primary-color); color: var(--primary-color); }

        .user-lookup { display: flex; gap: 8px; margin-top: 8px; }
        .user-lookup input { flex: 1; }

        .notif-btn {
            width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 13px; font-weight: 700;
            background: linear-gradient(135deg, #007bff, #fd7e14); color: #fff; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
        }
        .notif-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0, 123, 255, 0.35); }

        .hist-list { display: flex; flex-direction: column; gap: 10px; max-height: 560px; overflow-y: auto; padding-right: 6px; }
        .hist-item { border: 1px solid var(--border-color); border-radius: 10px; padding: 12px 14px; background: var(--input-bg, #0d1117); }
        .hist-item.pinned { border-color: var(--primary-color); }
        .hist-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
        .hist-title { font-size: 13px; font-weight: 700; color: var(--text-color); display: flex; align-items: center; gap: 6px; }
        .hist-title i.pin { color: var(--primary-color); }
        .hist-meta { font-size: 11px; color: var(--text-secondary); }
        .hist-body { font-size: 12px; color: var(--text-secondary); margin: 6px 0; white-space: pre-wrap; word-break: break-word; max-height: 60px; overflow: hidden; }
        .hist-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .hist-btn {
            background: transparent; border: 1px solid var(--border-color); border-radius: 6px; padding: 4px 10px;
            font-size: 11px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
        }
        .hist-btn:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .hist-btn.danger:hover { border-color: #dc3545; color: #dc3545; }
        .empty-hist { text-align: center; color: var(--text-secondary); font-size: 13px; padding: 30px 0; }
    </style>
</head>
<body>
    <!-- Navbar -->
      <!-- ── NAVBAR ── -->
    <!-- ── NAVBAR ── -->
    <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> Notifications</div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> My Profile</a>
          <a href="/my-servers"><i class='bx bx-server'></i> My Servers</a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> Logout</a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main -->
    <main class="main-content">
        <div class="page-breadcrumb">
            <span>Admin</span> <span class="sep">/</span> <span data-i18n="not.title"><span>
        </div>
        <div class="page-title-row">
            <div class="page-title-icon"><i class='bx bx-bell'></i></div>
            <div>
                <h1 class="page-title">Notification Center</h1>
                <p class="page-subtitle">Send in-app notifications to dashboard users and control announcements.</p>
            </div>
        </div>

        <div class="notif-grid">
            <!-- Compose -->
            <div class="notif-card">
                <h2><i class='bx bx-send'></i> Compose Notification</h2>

                <div class="form-group">
                    <label>Audience</label>
                    <div class="target-row" id="targetRow">
                        <span class="target-chip active" data-target="everyone"><i class='bx bx-world'></i> Everyone</span>
                        <span class="target-chip" data-target="admin-only"><i class='bx bx-shield'></i> Admins Only</span>
                        <span class="target-chip" data-target="user"><i class='bx bx-user'></i> Specific User</span>
                    </div>
                    <div class="user-lookup" id="userLookup" style="display: none;">
                        <input class="notif-input" id="targetUserId" placeholder="Discord User ID (e.g. 804999528129363998)">
                    </div>
                </div>

                <div class="form-group">
                    <label>Title</label>
                    <input class="notif-input" id="notifTitle" placeholder="e.g. Big update coming this weekend!" maxlength="256">
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea class="notif-textarea" id="notifMessage" placeholder="Write your announcement here..." maxlength="4000"></textarea>
                </div>

                <div class="form-group">
                    <label>Action link (optional)</label>
                    <div style="display: flex; gap: 8px;">
                        <input class="notif-input" id="notifUrl" placeholder="https://..." style="flex: 2;">
                        <input class="notif-input" id="notifUrlLabel" placeholder="Button text" maxlength="40" style="flex: 1;">
                    </div>
                </div>

                <div class="form-group">
                    <label>Type</label>
                    <select class="notif-select" id="notifType">
                        <option value="info">ℹ️ Info</option>
                        <option value="success">✅ Success</option>
                        <option value="warning">⚠️ Warning</option>
                        <option value="error">❌ Error</option>
                    </select>
                </div>

                <button class="notif-btn" id="sendBtn" type="button"><i class='bx bx-send'></i>&nbsp; Send Notification</button>
            </div>

            <!-- History -->
            <div class="notif-card">
                <h2><i class='bx bx-history'></i> Notification History</h2>
                <div class="hist-list" id="histList">
                    <div class="empty-hist">Loading history...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="/i18n.js?v=6"></script>
  <script src="/shared.js?v=6"></script>
    <script>
        let currentTarget = 'everyone';

        document.getElementById('targetRow').addEventListener('click', (e) => {
            const chip = e.target.closest('.target-chip');
            if (!chip) return;
            document.querySelectorAll('.target-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            currentTarget = chip.dataset.target;
            document.getElementById('userLookup').style.display = currentTarget === 'user' ? 'flex' : 'none';
        });

        document.getElementById('sendBtn').addEventListener('click', sendNotification);

        async function sendNotification() {
            const title = document.getElementById('notifTitle').value.trim();
            const message = document.getElementById('notifMessage').value.trim();
            if (!title || !message) return window.showToast ? window.showToast('Please fill in title and message', 'error') : alert('Title and message are required');

            const payload = { title, message, type: document.getElementById('notifType').value };
            if (currentTarget === 'user') {
                const uid = document.getElementById('targetUserId').value.trim();
                if (!/^\d{15,22}$/.test(uid)) return window.showToast ? window.showToast('Enter a valid Discord User ID', 'error') : alert('Enter a valid Discord User ID');
                payload.recipientId = uid;
            } else if (currentTarget === 'admin-only') {
                payload.forAdmin = true;
            }
            const url = document.getElementById('notifUrl').value.trim();
            const label = document.getElementById('notifUrlLabel').value.trim();
            if (url) { payload.actionUrl = url; payload.actionLabel = label || 'Open'; }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/admin/notifications/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.success) {
                    window.showToast ? window.showToast('Notification sent successfully', 'success') : alert('Sent!');
                    document.getElementById('notifTitle').value = '';
                    document.getElementById('notifMessage').value = '';
                    loadHistory();
                } else {
                    window.showToast ? window.showToast(data.error || 'Failed to send', 'error') : alert(data.error || 'Failed');
                }
            } catch (err) {
                window.showToast ? window.showToast('Network error', 'error') : alert('Network error');
            } finally {
                btn.disabled = false;
            }
        }

        async function loadHistory() {
            const list = document.getElementById('histList');
            try {
                const res = await fetch('/api/admin/notifications', { credentials: 'same-origin' });
                const data = await res.json();
                const items = (data.notifications || []);
                if (!items.length) { list.innerHTML = '<div class="empty-hist">No notifications sent yet.</div>'; return; }
                list.innerHTML = items.map(n => `
                    <div class="hist-item ${n.pinned ? 'pinned' : ''}">
                        <div class="hist-head">
                            <div class="hist-title"><i class='bx ${typeIcon(n.type)}'></i> ${esc(n.title)}${n.pinned ? '<i class="bx bx-pin pin"></i>' : ''}</div>
                            <div class="hist-meta">${esc(n.createdByLabel || 'Admin')} • ${new Date(n.createdAt).toLocaleString()}</div>
                        </div>
                        <div class="hist-body">${esc(n.message)}</div>
                        <div class="hist-actions">
                            <button class="hist-btn" onclick="togglePin('${n._id}')">${n.pinned ? 'Unpin' : 'Pin'}</button>
                            <button class="hist-btn danger" onclick="deleteNotif('${n._id}')"><i class='bx bx-trash'></i> Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                list.innerHTML = '<div class="empty-hist">Failed to load history.</div>';
            }
        }

        function typeIcon(t) {
            return { info: 'bx-info-circle', success: 'bx-check-circle', warning: 'bx-error', error: 'bx-x-circle' }[t] || 'bx-bell';
        }
        function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

        window.togglePin = async function(id) {
            await fetch(`/api/admin/notifications/${id}/pin`, { method: 'POST', credentials: 'same-origin' });
            loadHistory();
        };
        window.deleteNotif = async function(id) {
            const confirmed = window.Swal ? await Swal.fire({ title: 'Delete this notification?', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'Delete' }) : confirm('Delete this notification?');
            if (!(window.Swal ? confirmed.isConfirmed : confirmed)) return;
            await fetch(`/api/admin/notifications/${id}`, { method: 'DELETE', credentials: 'same-origin' });
            loadHistory();
            window.showToast ? window.showToast('Deleted', 'success') : null;
        };

        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
