<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Offline - ProMcBot</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: #0a0e17; color: #f1f5f9; font-family: 'Inter', system-ui, sans-serif; text-align: center;
        }
        .box { max-width: 420px; padding: 40px 28px; background: #111827; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; }

        p { color: #94a3b8; font-size: 14px; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 20px; padding: 11px 24px; border-radius: 10px; background: #4070f4; color: white; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>
    <div class="box">
        <i class='bx bx-wifi-off'></i>
        <h1>This site is offline</h1>
        <p>The server owner has not enabled their website yet, or the server does not exist.</p>
        <a class="btn" href="https://promcbot.dev">Visit ProMcBot</a>
    </div>

</html>
