<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo_item">
            <i class="bx bx-menu" id="sidebarToggle"></i>
            <span class="logo_name">ProMcBot</span>
        </div>
        <div class="navbar_content">
            <i class='bx bx-sun' id="darkLight"></i>
            <div class="nav_btn" id="notificationBtn">
                <i class='bx bx-bell'></i>
            </div>
            <div class="user_profile" id="userBtn">
                <img src="" alt="Profile" class="profile_img" data-user-avatar>
                <span class="user_name" data-user-name>User</span>
            </div>
        </div>
    </nav>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <!-- Sidebar content injected by shared.js -->
        <div class="sidebar-footer">
            <button class="collapse-btn"><i class='bx bx-chevron-left'></i> Collapse</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/servers">Servers</a> <span class="sep">/</span> <span id="breadServerName">Loading...</span> <span class="sep">/</span> <span>Overview</span>
        </div>
        
        <div class="server-page-header">
            <div class="server-page-icon" id="serverIconContainer">
                <span id="serverIconText">...</span>
            </div>
            <div class="server-page-info">
                <h1 class="server-page-name" id="serverName">Loading Server...</h1>
                <div class="server-page-meta">
                    <div class="bot-status-badge" id="botStatusBadge">
                        <i class='bx bx-loader-alt bx-spin'></i> Loading bot status...
                    </div>
                </div>
            </div>
        </div>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-card-icon blue"><i class='bx bx-group'></i></div>
                <div>
                    <div class="stat-card-value" id="statMembers">0</div>
                    <div class="stat-card-label">Members</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon green"><i class='bx bx-list-ul'></i></div>
                <div>
                    <div class="stat-card-value" id="statLogs">0</div>
                    <div class="stat-card-label">Logs</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon purple"><i class='bx bx-message-rounded-dots'></i></div>
                <div>
                    <div class="stat-card-value" id="statAR">0</div>
                    <div class="stat-card-label">Auto Responders</div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-history'></i></div>
                <div>
                    <h2 class="card-title">Recent Activity</h2>
                    <p class="card-subtitle">Latest logs for this server</p>
                </div>
            </div>
            <div class="timeline" id="recentLogsContainer">
                <p style="color: var(--text-muted); padding: 10px;">Loading recent activity...</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-grid-alt'></i></div>
                <div>
                    <h2 class="card-title">Modules</h2>
                    <p class="card-subtitle">Active features on this server</p>
                </div>
            </div>
            <div class="modules-grid" id="modulesContainer">
                <p style="color: var(--text-muted); padding: 10px;">Loading modules...</p>
            </div>
        </div>

    </main>

    <script src="/shared.js"></script>
    <script>
        const guildId = window.location.pathname.split('/')[2];

        document.addEventListener('DOMContentLoaded', async () => {
            const storedName = localStorage.getItem(`guild_name_${guildId}`) || guildId;
            const storedIcon = localStorage.getItem(`guild_icon_${guildId}`);
            
            document.getElementById('breadServerName').textContent = storedName;
            document.getElementById('serverName').textContent = storedName;
            
            const iconContainer = document.getElementById('serverIconContainer');
            if (storedIcon && storedIcon !== 'null') {
                iconContainer.innerHTML = `<img src="${storedIcon}" alt="Server Icon">`;
            } else {
                iconContainer.innerHTML = storedName.charAt(0).toUpperCase();
            }

            loadData();
        });

        async function loadData() {
            try {
                const response = await fetch(`/api/server/${guildId}/overview`);
                const data = await response.json();
                
                if (data.success && data.overview) {
                    const ov = data.overview;
                    
                    document.getElementById('statMembers').textContent = ov.memberCount || 0;
                    document.getElementById('statLogs').textContent = ov.logCount || 0;
                    document.getElementById('statAR').textContent = ov.arCount || 0;
                    
                    const badge = document.getElementById('botStatusBadge');
                    if (ov.botPresent) {
                        badge.innerHTML = `<i class='bx bx-check-circle'></i> Bot is in server`;
                        badge.style.background = 'var(--success-light)';
                        badge.style.color = 'var(--success)';
                    } else {
                        badge.innerHTML = `<i class='bx bx-x-circle'></i> Bot is not in server`;
                        badge.style.background = 'var(--danger-light)';
                        badge.style.color = 'var(--danger)';
                    }
                    
                    const logsContainer = document.getElementById('recentLogsContainer');
                    if (ov.recentLogs && ov.recentLogs.length > 0) {
                        logsContainer.innerHTML = ov.recentLogs.map(log => \`
                            <div class="timeline-item">
                                <div class="timeline-dot \${log.type || 'info'}"></div>
                                <div class="timeline-card">
                                    <div class="timeline-meta">
                                        <span class="timeline-type">\${log.type || 'Event'}</span>
                                        <span class="timeline-time">\${log.time || new Date().toLocaleString()}</span>
                                        \${log.user ? \`<span class="timeline-user"><i class='bx bx-user'></i> \${log.user}</span>\` : ''}
                                    </div>
                                    <div class="timeline-content">\${log.message || log.action || 'Unknown activity'}</div>
                                </div>
                            </div>
                        \`).join('');
                    } else {
                        logsContainer.innerHTML = \`<p style="color: var(--text-muted); padding: 10px;">No recent activity found.</p>\`;
                    }
                    
                    const modulesContainer = document.getElementById('modulesContainer');
                    if (ov.modules && Object.keys(ov.modules).length > 0) {
                        modulesContainer.innerHTML = Object.entries(ov.modules).map(([name, active]) => \`
                            <div class="module-card \${active ? 'active' : ''}">
                                <div class="module-card-icon"><i class='bx bx-extension'></i></div>
                                <div class="module-card-body">
                                    <div class="module-card-title" style="text-transform: capitalize;">\${name}</div>
                                    <div class="module-card-toggle">
                                        <span class="\${active ? 'on' : ''}">\${active ? 'Enabled' : 'Disabled'}</span>
                                    </div>
                                </div>
                            </div>
                        \`).join('');
                    } else {
                        modulesContainer.innerHTML = \`<p style="color: var(--text-muted); padding: 10px;">No modules data available.</p>\`;
                    }
                } else {
                    Swal.fire('Error', 'Failed to load overview data', 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'An error occurred while fetching overview data', 'error');
            }
        }
    </script>
</body>
</html>
