<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Overview — ProMcBot</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: var(--surface);
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stat-icon {
      width: 50px; height: 50px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; background: var(--surface-2); color: #FF512F;
    }
    .stat-info .val { font-size: 20px; font-weight: 800; color: var(--text); }
    .stat-info .lbl { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    
    .server-header-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #311026 100%);
      padding: 40px; border-radius: 20px; color: white; margin-bottom: 30px;
      display: flex; align-items: center; gap: 24px;
    }
    .server-lg-icon { width: 100px; height: 100px; border-radius: 24px; border: 4px solid rgba(255,255,255,0.2); }
  </style>
</head>
<body class="dark">
  <nav class="navbar">
    <div class="logo_item">
      <i class="bx bx-menu" id="sidebarToggle"></i>
      <img src="/dashboard/logo.png" alt="ProMcBot">
      <span class="brand-name">ProMcBot</span>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight"><i class='bx bx-sun'></i></div>
      <img src="" class="user-avatar" data-user-avatar id="userBtn">
    </div>
  </nav>

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main-content">
    <div class="server-header-card">
      <img src="" class="server-lg-icon" id="guildIcon">
      <div>
        <h1 id="guildName">Loading Server...</h1>
        <p id="guildIdText">ID: —</p>
      </div>
    </div>

    <div class="overview-grid">
      <div class="stat-card">
        <div class="stat-icon"><i class="bx bx-user"></i></div>
        <div class="stat-info">
          <div class="val" id="memberCount">—</div>
          <div class="lbl">Total Members</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="bx bx-broadcast"></i></div>
        <div class="stat-info">
          <div class="val" id="mcStatus">Checking...</div>
          <div class="lbl">Minecraft Bridge</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><i class="bx bx-bolt-circle"></i></div>
        <div class="stat-info">
          <div class="val" id="prefix">!</div>
          <div class="lbl">Bot Prefix</div>
        </div>
      </div>
    </div>
  </main>

  <script src="/shared.js"></script>
  <script>
    async function loadOverview() {
      const gId = window.location.pathname.match(/\/servers\/(\d+)/)[1];
      try {
        const res = await fetch('/callback/check/userData');
        const data = await res.json();
        const guild = data.user.guilds.find(g => g.id === gId);
        
        if (guild) {
          document.getElementById('guildName').innerText = guild.name;
          document.getElementById('guildIdText').innerText = `ID: ${guild.id}`;
          document.getElementById('guildIcon').src = guild.icon 
            ? `https://cdn.discordapp.com/icons/${guild.id}/${guild.icon}.png`
            : `https://cdn.discordapp.com/embed/avatars/0.png`;
        }
      } catch (e) {
        console.error("Failed to load overview", e);
      }
    }
    document.addEventListener('DOMContentLoaded', loadOverview);
  </script>
</body>
</html>
