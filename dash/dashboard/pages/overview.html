<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - ProMcBot</title>
    <link rel="stylesheet" href="/shared.css?v=7">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <!-- Navbar -->
      <!-- ── NAVBAR ── -->
    <!-- ── NAVBAR ── -->
    <!-- ── NAVBAR ── -->
  <nav class="navbar">
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="mobile-toggle" id="sidebarToggle">
        <i class='bx bx-menu'></i>
      </div>
      <a href="/dashboard" class="logo_item">
        <img src="/dashboard/logo.png" alt="ProMcBot Logo" class="logo_image" onerror="this.onerror=null;this.src='/public/images/logo.svg';">
        <span class="brand-name">ProMcBot</span>
      </a>
    </div>
    <div class="navbar_content">
      <div class="nav-icon-btn" id="darkLight" title="Toggle theme">
        <i class='bx bx-sun'></i>
      </div>
      <div class="dropdown">
        <div class="nav-icon-btn" id="notificationBtn" title="Notifications">
          <i class='bx bx-bell'></i>
          <span class="notification-badge" id="notifBadge" style="display:none">0</span>
        </div>
        <div class="dropdown-content notification-dropdown" id="notificationDropdown">
          <div class="dropdown-header"><i class='bx bx-bell'></i> <span data-i18n="not.title"><span></div>
          <div class="notification-item">
            <div class="notification-icon"><i class='bx bx-info-circle'></i></div>
            <div class="notification-content">
              <div class="notification-title" data-i18n="not.welcome"><div>
              <div class="notification-desc" data-i18n="not.empty"><div>
            </div>
          </div>
          <div class="dropdown-footer" data-i18n="not.title"><div>
        </div>
      </div>
      <div class="dropdown">
        <img src="https://cdn.discordapp.com/embed/avatars/0.png"
             alt="Avatar" class="user-avatar" id="userBtn" data-user-avatar>
        <div class="dropdown-content" id="userDropdown">
          <div class="dropdown-header">
            <i class='bx bx-user'></i>
            <span id="navUserName" data-i18n="pg.loading"><span>
          </div>
          <a href="/dashboard"><i class='bx bx-user-circle'></i> <span data-i18n="not.my_profile"><span></a>
          <a href="/my-servers"><i class='bx bx-server'></i> <span data-i18n="not.my_servers"><span></a>
          <div style="border-top:1px solid var(--border);margin:4px 0"></div>
          <a href="/api/logout" style="color:var(--danger)"><i class='bx bx-log-out'></i> <span data-i18n="not.logout"><span></a>
        </div>
      </div>
    </div>
  </nav>
  <!-- ── SIDEBAR (auto-built by shared.js) ── -->
  <nav class="sidebar" id="sidebar">
    <div class="menu_content"></div>
    <div class="sidebar-footer">
      <div class="collapse-btn">
        <i class='bx bx-chevron-left'></i>
        <span data-i18n="nav.collapse"><span>
      </div>
    </div>
  </nav>
  <!-- ── MAIN CONTENT ── -->
<!-- Main Content -->
    <main class="main-content">
        <!-- Page Header -->
        <div class="page-breadcrumb">
            <a href="/my-servers" data-i18n="not.servers"><a> <span class="sep">/</span> <span id="breadServerName" data-i18n="pg.loading"><span> <span class="sep">/</span> <span data-i18n="not.overview"><span>
        </div>
        
        <div class="server-page-header">
            <div class="server-page-icon" id="serverIconContainer">
                <span id="serverIconText">...</span>
            </div>
            <div class="server-page-info">
                <h1 class="server-page-name" id="serverName" data-i18n="pg.loading_server"><h1>
                <div class="server-page-meta">
                    <div class="bot-status-badge" id="botStatusBadge">
                        <i class='bx bx-loader-alt bx-spin'></i> Loading bot status...
                    </div>
                </div>
            </div>
        </div>

        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-card-icon blue"><i class='bx bx-group'></i></div>
                <div>
                    <div class="stat-card-value" id="statMembers">0</div>
                    <div class="stat-card-label" data-i18n="not.members"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon green"><i class='bx bx-list-ul'></i></div>
                <div>
                    <div class="stat-card-value" id="statLogs">0</div>
                    <div class="stat-card-label" data-i18n="not.logs"></div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon purple"><i class='bx bx-message-rounded-dots'></i></div>
                <div>
                    <div class="stat-card-value" id="statAR">0</div>
                    <div class="stat-card-label" data-i18n="not.auto_responders">Auto Responders</div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 24px;">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-history'></i></div>
                <div>
                    <h2 class="card-title" data-i18n="not.recent_activity"></h2>
                    <p class="card-subtitle" data-i18n="not.recent_activity_sub">Latest logs for this server</p>
                </div>
            </div>
            <div class="timeline" id="recentLogsContainer">
                <p style="color: var(--text-muted); padding: 10px;">Loading recent activity...</p>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-icon"><i class='bx bx-grid-alt'></i></div>
                <div>
                    <h2 class="card-title" data-i18n="not.modules"></h2>
                    <p class="card-subtitle" data-i18n="not.modules_sub">Active features on this server</p>
                </div>
            </div>
            <div class="modules-grid" id="modulesContainer">
                <p style="color: var(--text-muted); padding: 10px;">Loading modules...</p>
            </div>
        </div>

        <!-- Minecraft Server Hub -->
        <div class="card">
            <div class="card-header">
                <div class="card-icon orange"><i class='bx bx-game'></i></div>
                <div>
                    <h2X class="card-title" data-i18n="not.mc_server">Minecraft Server</h2>
                    <p class="card-subtitle" data-i18n="not.mc_server_sub">Server connection info saved for this Discord server</p>
                </div>
                <a href="/my-servers/${guildId}/players" id="mcPlayersLink" class="btn-primary" style="margin-left: auto;"><i class='bx bx-user-plus'></i> <span data-i18n="not.player_lookup">Player Lookup</span></a>
            </div>
            <div class="stat-cards" id="mcInfoContainer">
                <p style="color: var(--text-muted); padding: 10px;">Loading Minecraft info...</p>
            </div>
        </div>

    </main>

    <script src="/i18n.js?v=6"></script>
  <script src="/shared.js?v=6"></script>
    <script>
        const guildId = window.getGuildIdFromPath() || (window.location.pathname.match(/\/my-servers\/(\d+)/) || [])[1] || '';
        if (!guildId) {
          Swal.fire('Error', 'Server ID not found in the URL. Please go back to My Servers and open this server again.', 'error');
          throw new Error('Page guard triggered: missing context.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            let storedName = localStorage.getItem(`guild_name_${guildId}`);
            const storedIcon = localStorage.getItem(`guild_icon_${guildId}`);
            if (!storedName) {
                try {
                    const g = await fetch('/api/guilds').then(r => r.json());
                    const mine = (g.servers || g.guilds || []).find(x => String(x.id) === guildId);
                    if (mine && mine.name) {
                        storedName = mine.name;
                        try { localStorage.setItem(`guild_name_${guildId}`, storedName); } catch(_){}
                    }
                } catch(_) {}
            }
            storedName = storedName || guildId;
            document.getElementById('breadServerName').textContent = storedName;
            document.getElementById('serverName').textContent = storedName;
            
            const iconContainer = document.getElementById('serverIconContainer');
            if (storedIcon && storedIcon !== 'null') {
                iconContainer.innerHTML = `<img src="${storedIcon}" alt="Server Icon">`;
            } else {
                iconContainer.innerHTML = storedName.charAt(0).toUpperCase();
            }

            loadData();
        });

        document.addEventListener('DOMContentLoaded', () => {
            const lnk = document.getElementById('mcPlayersLink');
            if (lnk) lnk.href = `/my-servers/${guildId}/players`;
        });

        async function loadData() {
            try {
                const response = await fetch(`/api/server/${guildId}/overview`);
                const data = await response.json();
                
                if (data.success && data.overview) {
                    const ov = data.overview;
                    
                    document.getElementById('statMembers').textContent = ov.memberCount || 0;
                    document.getElementById('statLogs').textContent = ov.logCount || 0;
                    document.getElementById('statAR').textContent = ov.arCount || 0;
                    
                    const badge = document.getElementById('botStatusBadge');
                    if (ov.botPresent) {
                        badge.innerHTML = `<i class='bx bx-check-circle'></i> Bot is in server`;
                        badge.style.background = 'var(--success-light)';
                        badge.style.color = 'var(--success)';
                    } else {
                        badge.innerHTML = `<i class='bx bx-x-circle'></i> Bot is not in server`;
                        badge.style.background = 'var(--danger-light)';
                        badge.style.color = 'var(--danger)';
                    }
                    
                    const logsContainer = document.getElementById('recentLogsContainer');
                    if (ov.recentLogs && ov.recentLogs.length > 0) {
                        logsContainer.innerHTML = ov.recentLogs.map(log => {
                            const timeText = log.createdAt ? new Date(log.createdAt).toLocaleString() : (log.time || new Date().toLocaleString());
                            const userText = log.user ? `<span class="timeline-user"><i class='bx bx-user'></i> ${log.user}</span>` : '';
                            const messageText = log.message || log.reason || log.action || 'Unknown activity';
                            return `
                                <div class="timeline-item">
                                    <div class="timeline-dot ${log.type || 'info'}"></div>
                                    <div class="timeline-card">
                                        <div class="timeline-meta">
                                            <span class="timeline-type">${log.type || 'Event'}</span>
                                            <span class="timeline-time">${timeText}</span>
                                            ${userText}
                                        </div>
                                        <div class="timeline-content">${messageText}</div>
                                    </div>
                                </div>
                            `;
                        }).join('');
                    } else {
                        logsContainer.innerHTML = `<p style="color: var(--text-muted); padding: 10px;">No recent activity found.</p>`;
                    }
                    
                    const modulesContainer = document.getElementById('modulesContainer');
                    if (ov.modules && Object.keys(ov.modules).length > 0) {
                        modulesContainer.innerHTML = Object.entries(ov.modules).map(([name, active]) => `
                            <div class="module-card ${active ? 'active' : ''}">
                                <div class="module-card-icon"><i class='bx bx-extension'></i></div>
                                <div class="module-card-body">
                                    <div class="module-card-title" style="text-transform: capitalize;">${name}</div>
                                    <div class="module-card-toggle">
                                        <span class="${active ? 'on' : ''}">${active ? 'Enabled' : 'Disabled'}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        modulesContainer.innerHTML = `<p style="color: var(--text-muted); padding: 10px;">No modules data available.</p>`;
                    }
                } else {
                    Swal.fire('Error', 'Failed to load overview data', 'error');
                }
            } catch (err) {
      console.error(err);
      Swal.fire('Error', `An error occurred: ${err.message || 'Unknown error'}`, 'error');
    }

            loadMcInfo();
        }

        async function loadMcInfo() {
            const container = document.getElementById('mcInfoContainer');
            try {
                const res = await fetch(`/api/server/${guildId}/mc-info`);
                const data = await res.json();
                if (res.ok && data.success) {
                    const info = data.info || {};
                    const cfg = data.mcConfig;
                    const connectedBadge = cfg
                        ? `<span class="bot-status-badge" style="background: var(--success-light); color: var(--success);"><i class='bx bx-check-circle'></i> <span data-i18n="not.api_linked">API linked</span></span>`
                        : `<span class="bot-status-badge" style="background: var(--warning-light, rgba(245,158,11,.15)); color: var(--warning, #f59e0b);"><i class='bx bx-unlink'></i> <span data-i18n="not.api_not_linked">API not linked (/mc-setup)</span></span>`;
                    container.innerHTML = `
                        <div class="stat-card" style="grid-column: 1 / -1;">
                            ${connectedBadge}
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-icon blue"><i class='bx bx-globe'></i></div>
                            <div>
                                <div class="stat-card-value">${info.javaIP || '—'}</div>
                                <div class="stat-card-label" data-i18n="not.java_ip">Java IP</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-icon green"><i class='bx bx-radio'></i></div>
                            <div>
                                <div class="stat-card-value">${info.javaPort || '—'}</div>
                                <div class="stat-card-label" data-i18n="not.java_port">Java Port</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-icon purple"><i class='bx bx-grid-alt'></i></div>
                            <div>
                                <div class="stat-card-value">${info.bedrockIP || '—'}</div>
                                <div class="stat-card-label" data-i18n="not.bedrock_ip">Bedrock IP</div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-card-icon orange"><i class='bx bx-category'></i></div>
                            <div>
                                <div class="stat-card-value">${(info.serverType || '—').toUpperCase()}</div>
                                <div class="stat-card-label" data-i18n="pg.server_type"></div>
                            </div>
                        </div>`;
                } else {
                    container.innerHTML = `<p style="color: var(--text-muted); padding: 10px;">No Minecraft info saved yet.</p>`;
                }
            } catch (err) {
                container.innerHTML = `<p style="color: var(--text-muted); padding: 10px;">Unable to load Minecraft info.</p>`;
            }
        }
    </script>
</body>
</html>
