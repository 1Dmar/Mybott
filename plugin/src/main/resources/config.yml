# Provision this file per Minecraft server. Never commit real credentials.
backend:
  # Use the secure public API URL in production; localhost is allowed for local development.
  base-url: "https://promcbot.dev"
  server-id: ""
  instance-id: ""
  network-id: ""
  minecraft-server-id: ""
  server-name: ""
  access-token: ""
  signing-secret: ""
  protocol-version: "1"
  heartbeat-seconds: 60
telemetry:
  batch-size: 100
  max-queue-size: 5000
  snapshot-seconds: 60
  # Durable local retry spool. Set false only when deliberate data loss is acceptable.
  spool-enabled: true
  spool-max-bytes: 8388608
